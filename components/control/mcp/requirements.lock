# requirements.lock for the MCP tool-surface image (linux/amd64, CPython 3.12).
# Generated from requirements.in with, run from the repository root:
#
#   uv pip compile components/control/mcp/requirements.in #       --python-version 3.12 --python-platform x86_64-unknown-linux-gnu #       --only-binary :all: --generate-hashes #       --output-file components/control/mcp/requirements.lock
#
# uv, and not the `pip download` line docs/BUILD.md carries for the other locks: mcp 1.29.1 declares
# `pywin32; sys_platform == "win32"`, and pip evaluates a requirement's marker against the interpreter
# it is RUNNING on rather than the --platform it was given, so the command in BUILD.md cannot resolve
# this closure on a Windows host (it asks PyPI for pywin32 and refuses). uv evaluates markers against
# --python-platform, which is the target. The same tool generated components/control/sigma/compiler.lock.
#
# What was then trimmed, by hand and against the published metadata rather than by the resolver: every
# hash belongs to a wheel a `python:3.12-slim` interpreter on linux/amd64 can select (cp312, or an
# abi3 wheel whose stated minimum is at or below cp312, with a manylinux x86_64 or `any` platform tag).
# Source distributions and every other architecture are out of the lock, so the `--require-hashes`
# install in the Dockerfile can neither build a package from source nor accept a wheel the runtime
# cannot load. Where a project ships several glibc levels (cryptography, cffi, pydantic-core, rpds-py,
# PyYAML), each x86_64 linux wheel is listed, because pip picks one by tag priority and a single hash
# that names the wrong variant fails the build rather than installing anything.
#
# Read on 2026-09-10: all 35 hashes below were recomputed by downloading each named file from
# files.pythonhosted.org and hashing the bytes, and every one equalled PyPI's own declared sha256 for
# that filename. No install was performed and no image built from this lock here; the check that
# `pip install --require-hashes -r` succeeds on linux/amd64 is row 1 of conformance.md and is unrun.
# The 10 packages this lock shares with components/control/platform/requirements.lock agree with it on
# both version and digest, so the two images install identical copies of the interpreter's common set.
# Do not hand-edit; see docs/BUILD.md.
