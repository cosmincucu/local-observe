  # *endpoints*, not three code paths — one condition each, because conditions inside one endpoint
  # are ANDed and the adapter reads one boolean per endpoint (detections.gatus_sample). Crossing
  # into a tighter stage is then a different endpoint failing, i.e. a different rule_id, which is
  # what keeps 30/14/1-day from swallowing each other. Feature used for each stage, at the pinned
  # tag: the `[CERTIFICATE_EXPIRATION]` placeholder compared against a duration (README's
