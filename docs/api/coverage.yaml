# Capability census: every operation this product supports, and the one that is planned next.
#
# One row per operation. `docs/api/COVERAGE.md` explains each column, `docs/api/openapi.yaml` is the
# contract for the rows whose `surface` is `http` and whose `status` is `implemented`.
# `tests/test_api_openapi_conformance.py` fails when a row, the OpenAPI document and the served routes
# disagree; `tests/test_api_surface_parity.py` fails when a non-http row has not said why it stays off HTTP.
#
# Flow style is deliberate: 166 rows in block style would be 1 660 lines a reviewer cannot scan, and a
# row is one sentence, not a tree.
schema_version: 1
updated: "2026-11-02"

# The closed vocabularies a row must choose from. The test reads them from here, so a new value is a
# change to this file first and never a one-off spelling in a row.
vocabularies:
  surfaces: [http, cli, mcp, ui]
  access: [read, write]
  status: [implemented, planned, excluded]
  owner_areas:
    - foundation
    - occurrences
    - maintenance
    - resources-queries-rules-config
    - investigations-notifications-actions
    - administration
  # For an http row this names the credential role a bearer must carry. For cli, mcp and ui rows it
  # names the authority the surface reaches: `local` is the operator's own file access, `bearer` is a
  # mounted credential the caller holds, `none` is deliberately unauthenticated.
  authority: [reader, producer, proposer, human, executor, summary, local, bearer, none]
  # Which artifact is expected to describe this row. `openapi` means docs/api/openapi.yaml must carry the
  # same operationId under the same path and method; `none` means the row is a cross-cutting rule, a
  # third-party surface or a browser-side render, and no OpenAPI operation is owed for it. A row with no
  # `contract` key is treated as `openapi` when its surface is http and its path is a single route.
  contract: [openapi, none]
  # Why one capability is reachable only from a surface that is not HTTP. These four reasons are the whole
  # vocabulary, and they are closed because "we have not got to it" is not a reason — that is `planned`.
  # A non-http row carries exactly one of `http_via` (an operationId on the http surface that answers the
  # same capability, so the absence of a second route is a decision already kept) or `no_http` (one reason
  # below, plus a `notes` sentence that says which). `tests/test_api_surface_parity.py` is what makes an
  # unexplained absence fail the suite rather than stay a footnote.
  #   long_lived_process   — the capability *is* running a server; a route cannot start one for you.
  #   offline_bootstrap    — it must work while the API is down, and naming a route for it would teach an
  #                          operator to reach for the wrong tool during the one incident that matters.
  #   unvalidated_proxy    — it would hand a bearer token somebody else's shell, SQL, DDL or backend,
  #                          unvalidated, which §5 forbids whatever the role.
  #   human_approval_only  — the capability's whole output is a human decision this surface may not cast.
  exclusion_reasons: [long_lived_process, offline_bootstrap, unvalidated_proxy, human_approval_only]

operations:
  # ------------------------------------------------------------------------------------------
  # foundation — identity, health, the transport boundary itself
  # ------------------------------------------------------------------------------------------
  - {operation_id: platform.identity.read, surface: http, method: GET, path: /v1/me, resource: identity,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor, summary],
     side_effects: none, state_source: "credential file (no database read)", status: implemented, owner_area: foundation,
     notes: "The only route a summary credential may call besides /v1/overview; it answers who the bearer is."}
  - {operation_id: platform.status.read, surface: http, method: GET, path: /v1/status, resource: platform,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite: incidents, actions, outbox counts", status: implemented, owner_area: foundation}
  - {operation_id: platform.runtime.read, surface: http, method: GET, path: /v1/runtime, resource: platform,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "startup filesystem snapshot, in-process delivery/refusal counters", status: implemented, owner_area: foundation,
     notes: "Process-local counters reset when the process does; they are not durable history."}
  - {operation_id: platform.overview.read, surface: http, method: GET, path: /v1/overview, resource: portal-summary,
     module: local_observe/platform/overview.py, access: read, required_role: [reader, producer, proposer, human, executor, summary],
     side_effects: none, state_source: "sqlite counts, optional overview document", status: implemented, owner_area: foundation,
     notes: "Portal summary v1 (docs/CONTRACTS.md). Unknown, disabled and stale observations carry null values."}
  - {operation_id: platform.audit.read, surface: http, method: GET, path: /v1/audit, resource: audit,
     module: local_observe/platform/audit_reader.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite audit table, read-only connection", status: implemented, owner_area: administration,
     notes: "Bounded page over append-only history; the parser refuses before any file is opened."}
  - {operation_id: platform.health.read, surface: http, method: GET, path: /v1/health, resource: platform,
     module: local_observe/platform/administration_api.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "the seams this process was handed at startup, plus the store's schema version", status: implemented, owner_area: foundation,
     notes: "What is wired, what is off by choice, and what is absent because nothing could add it — the three answers an installer needs and /v1/runtime does not give. It reports no verdict on anything it cannot see, and names those absences instead."}
  - {operation_id: platform.boundary.read, surface: http, method: GET, path: /v1/boundary, resource: api-contract,
     module: local_observe/platform/administration_api.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "declared exclusions (tools.COMPONENT_BOUNDARY)", status: implemented, owner_area: foundation,
     notes: "The same document the component_boundary MCP tool answers with, so an agent on either surface reads one list of what this product refuses to do."}
  - {operation_id: platform.openapi.read, surface: http, method: GET, path: /v1/openapi.json, resource: api-contract,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "docs/api/openapi.yaml, shipped as package data", status: planned, owner_area: foundation,
     notes: "Serving the contract is a separate decision: it publishes the route table to every caller that can reach the port, and F1 ships the document without the route."}
  - {operation_id: foundation.request_identity.apply, surface: http, method: GET, path: "any /v1 route", resource: api-contract,
     module: local_observe/platform/api_contract.py, access: read, required_role: [reader, producer, proposer, human, executor, summary],
     side_effects: none, state_source: none, status: implemented, owner_area: foundation, contract: none,
     notes: "Cross-cutting: one x-request-id per request, echoed on every answer and carried into the server-side log line. It is a rule over every route, not an addressable operation."}
  - {operation_id: foundation.idempotent_write.apply, surface: http, method: POST, path: "the routes listed in api.IDEMPOTENT_POST_ROUTES", resource: api-contract,
     module: local_observe/platform/api_contract.py, access: write, required_role: [producer, proposer, human, executor],
     side_effects: "one api_idempotency row per keyed write", state_source: "sqlite: api_idempotency (schema v11)", status: implemented, owner_area: foundation, contract: none,
     notes: "Opt-in by header. A route not listed ignores the header, so no client that exists today changes behaviour. Each keyed route is documented in its own row."}

  # ------------------------------------------------------------------------------------------
  # occurrences — findings, incidents, escalation of an unanswered one
  # ------------------------------------------------------------------------------------------
  - {operation_id: incident.records.read, surface: http, method: GET, path: "/v1/records/{table}", resource: incident,
     module: local_observe/platform/presentation.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite: events, incidents, actions, executions, audit, outbox, notification_attempts", status: implemented, owner_area: occurrences,
     notes: "One capped newest-first window over a closed table list; secret columns are dropped on read."}
  - {operation_id: occurrence.create, surface: http, method: POST, path: /v1/events, resource: occurrence,
     module: local_observe/platform/state.py, access: write, required_role: [producer],
     side_effects: "event, condition, incident, outbox and audit rows; a grouping link when the declared graph agrees", state_source: "sqlite operational store", status: implemented, owner_area: occurrences,
     notes: "Canonical event admission. Idempotent by (source, source_event_id), which is why it takes no Idempotency-Key."}
  - {operation_id: occurrence.intake, surface: http, method: POST, path: "/v1/intake/{source}", resource: occurrence,
     module: local_observe/platform/intake.py, access: write, required_role: [producer],
     side_effects: "evidence rows and admitted events, in payload order; audit rows", state_source: "sqlite operational store, optional built index for linking", status: implemented, owner_area: occurrences,
     notes: "External envelopes (Alertmanager today, CrowdSec beside it) are normalised here or become a coverage event. The path must name the caller's own identity."}
  - {operation_id: evidence.sample.create, surface: http, method: POST, path: /v1/evidence, resource: evidence,
     module: local_observe/platform/state.py, access: write, required_role: [producer],
     side_effects: "one bounded evidence row with a 15-day expiry", state_source: "sqlite evidence table", status: implemented, owner_area: occurrences,
     notes: "Honours Idempotency-Key: a producer that lost the answer reads its own evidence id back."}
  - {operation_id: evidence.sample.read, surface: http, method: GET, path: /v1/evidence, resource: evidence,
     module: local_observe/platform/state.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite evidence table", status: implemented, owner_area: occurrences,
     notes: "Answers available, expired or unavailable — an expired sample was real and is gone."}
  - {operation_id: occurrence.escalate, surface: cli, method: run, path: "lo-platform escalate", resource: occurrence,
     module: local_observe/platform/escalation.py, access: write, required_role: [local],
     side_effects: "one stage event per rung advanced, and the delivery it books", state_source: "sqlite + the producer's own cursor file", status: implemented, owner_area: occurrences,
     notes: "Files an event; never sends a notification itself."}
  - {operation_id: occurrence.history.read, surface: cli, method: read, path: "lo-platform --database <path> status", resource: occurrence,
     module: local_observe/platform/state.py, access: read, required_role: [local],
     side_effects: none, state_source: "sqlite counts", status: implemented, owner_area: occurrences}
  - {operation_id: occurrence.list, surface: http, method: GET, path: /v1/alert-occurrences, resource: occurrence,
     module: local_observe/platform/dispositions.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite: incidents, conditions, occurrence_dispositions (schema v12), outbox", status: implemented, owner_area: occurrences,
     notes: "Bounded page over episodes, oldest first. The measurement, the operator's disposition and the delivery roll-up are three blocks of one row and are never merged."}
  - {operation_id: occurrence.read, surface: http, method: GET, path: "/v1/alert-occurrences/{id}", resource: occurrence,
     module: local_observe/platform/dispositions.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite: incidents, conditions, occurrence_dispositions, occurrence_projections, outbox, actions, audit", status: implemented, owner_area: occurrences,
     notes: "One episode plus its `ETag`. An id that is not a canonical UUID and an id that names nothing answer the same 404, so the route is not an oracle for identifier shape."}
  - {operation_id: occurrence.disposition_history.read, surface: http, method: GET, path: "/v1/alert-occurrences/{id}/history", resource: occurrence,
     module: local_observe/platform/dispositions.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite: occurrence_disposition_history (append-only, schema v12)", status: implemented, owner_area: occurrences,
     notes: "Every disposition this episode ever carried, oldest first, including kinds the effective state has moved past. A restatement that changed nothing added no row."}
  - {operation_id: occurrence.acknowledge, surface: http, method: POST, path: "/v1/alert-occurrences/{id}/acknowledgements", resource: occurrence,
     module: local_observe/platform/dispositions.py, access: write, required_role: [human],
     side_effects: "disposition + history + audit rows, the fold of this episode's pending deliveries, two projection records", state_source: "sqlite: occurrence_dispositions, occurrence_disposition_history, outbox, notification_suppressions, audit, occurrence_projections", status: implemented, owner_area: occurrences,
     notes: "A human credential and a required reason, or nothing: an empty reason is refused because a disposition nobody can explain is the artifact this replaced. Stops repeats and holds later rungs of the same episode; resolves nothing, and an acknowledgement has no expiry — a clear followed by a re-fire is a new episode. Leased or sent messages are not recalled and the answer says so."}
  - {operation_id: occurrence.dismiss, surface: http, method: POST, path: "/v1/alert-occurrences/{id}/dismissals", resource: occurrence,
     module: local_observe/platform/dispositions.py, access: write, required_role: [human],
     side_effects: "as the acknowledgement, plus one (episode, condition) tombstone per group member and a fold that includes the recovery page", state_source: "sqlite: as the acknowledgement, plus occurrence_dismissals", status: implemented, owner_area: occurrences,
     notes: "Durable for one episode and no wider: the tombstone is keyed on the episode and its condition together, so a verdict replayed after a restart cannot page and the next episode still does. It never writes incidents.status or conditions.status — dismissal is not resolution — and it is final on this surface (a later acknowledgement is 409)."}
  - {operation_id: occurrence.dismiss.revoke, surface: http, method: POST, path: "/v1/alert-occurrences/{id}/dismissal-revocation", resource: occurrence,
     module: local_observe/platform/dispositions.py, access: write, required_role: [human],
     side_effects: "would remove the tombstones and the effective row, with their own audit row", state_source: "sqlite: occurrence_dispositions, occurrence_dismissals", status: planned, owner_area: occurrences,
     notes: "Not served, and the shape is unresolved rather than merely unbuilt: a revocation must say what happens to a delivery already folded by the dismissal (`Store.retry_notification` refuses to replay a folded row), and whether the episode re-arms if its condition is still firing. Both answers change what an operator can rely on, so neither is chosen in a row."}
  - {operation_id: occurrence.disposition.projection.drain, surface: cli, method: run, path: "planned", resource: occurrence,
     module: local_observe/platform/dispositions.py, access: write, required_role: [local],
     side_effects: "attempts the due projection records and moves their status", state_source: "sqlite: occurrence_projections (schema v12)", status: planned, owner_area: occurrences,
     notes: "`dispositions.drain` exists and is tested with injected sinks; nothing in this build mounts or runs it, and no address is proposed for it either — the honest shape is a command beside `lo-platform escalate`, and that is undecided. Until a caller exists, every disposition's projections stay `pending` and the occurrence read says so — the decision is downstream and unmade."}
  - {operation_id: occurrence.acknowledge.mcp, surface: mcp, method: tool, path: planned, resource: occurrence,
     module: local_observe/platform/tools.py, access: write, required_role: [bearer],
     side_effects: "as the HTTP route, attributed to the agent that called", state_source: "sqlite operational store", status: excluded, owner_area: occurrences,
     notes: "Excluded on purpose: §5 says a payload field cannot claim that an agent is a human, and an acknowledgement is exactly that claim. An agent may read and propose; only a human credential may acknowledge."}

  # ------------------------------------------------------------------------------------------
  # maintenance — declared windows, suppression, flap accounting
  # ------------------------------------------------------------------------------------------
  - {operation_id: maintenance.window.declare_cli, surface: cli, method: run, path: "python -m local_observe.platform.suppression (no declare command)", resource: maintenance-window,
     module: local_observe/platform/suppression.py, access: write, required_role: [local],
     side_effects: "none available from a command line", state_source: "sqlite notification_control", status: excluded, owner_area: maintenance,
     notes: "The read-only CLI refuses to declare: minting Actor(identity,'human') from a flag would claim a role the caller never proved. declare_window is reached by a caller holding a real human actor."}
  - {operation_id: maintenance.window.declare, surface: http, method: POST, path: /v1/maintenance-windows, resource: maintenance-window,
     module: local_observe/platform/maintenance_api.py, access: write, required_role: [human],
     side_effects: "one maintenance:<id> control document per scope member, each with its own maintenance.declared audit row it is attested against", state_source: "sqlite notification_control", status: implemented, owner_area: maintenance,
     notes: "A silence over a `resource`, `service` or `rule` scope, planned in advance and signed by a human credential. A service scope declares one window per member and answers with every id. A window whose end has already passed is refused: see docs/api/maintenance.md."}
  - {operation_id: maintenance.window.revoke, surface: http, method: POST, path: "/v1/maintenance-windows/{id}/cancellations", resource: maintenance-window,
     module: local_observe/platform/maintenance_api.py, access: write, required_role: [human],
     side_effects: "revoked marker on the control document plus its audit row; a live window stops covering immediately", state_source: "sqlite notification_control", status: implemented, owner_area: maintenance,
     notes: "Cancelling one window leaves an overlapping sibling running: the delivery path asks whether any live window covers a finding, so a cancellation that took a second author's silence with it would end work nobody cancelled. Takes an empty body; the durable revoke records who and when and keeps no free text."}
  - {operation_id: maintenance.window.read, surface: http, method: GET, path: /v1/maintenance-windows, resource: maintenance-window,
     module: local_observe/platform/maintenance_api.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite notification_control + audit attestation", status: implemented, owner_area: maintenance,
     notes: "The same `live_windows` answer the CLI gives, over the credential the platform already issues, with `bound_exceeded`, `unusable` and `unattested` beside the rows. `producer` is deliberately absent: a detector that could read which silences cover its own findings could time them."}
  - {operation_id: maintenance.window.detail.read, surface: http, method: GET, path: "/v1/maintenance-windows/{id}", resource: maintenance-window,
     module: local_observe/platform/maintenance_api.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite notification_control + audit attestation + incidents", status: implemented, owner_area: maintenance,
     notes: "One window by id, expired or revoked rows included, with the outcome the platform observed (planned, active, completed, cancelled, unused, overrun, unknown) and the evidence lines behind it."}
  - {operation_id: maintenance.window.history.read, surface: http, method: GET, path: "/v1/maintenance-windows/{id}/history", resource: maintenance-window,
     module: local_observe/platform/maintenance_api.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite notification_control, audit and notification rows", status: implemented, owner_area: maintenance,
     notes: "The window's timeline: declared, revoked, and each page it folded, attributed to this window by the delivery path that folded it."}
  - {operation_id: maintenance.schedule.declare, surface: http, method: POST, path: /v1/maintenance-schedules, resource: maintenance-schedule,
     module: local_observe/platform/maintenance_api.py, access: write, required_role: [human],
     side_effects: "one maintenance_schedules version, one window per occurrence per member up to the materialization horizon, one audit row per write", state_source: "sqlite maintenance_schedules (schema v12) + notification_control", status: implemented, owner_area: maintenance,
     notes: "A recurring plan with a finite bound: an IANA timezone, an explicit DST policy, and either an occurrence count or an end date. Open-ended silence is refused — unbounded silence is not maintenance."}
  - {operation_id: maintenance.schedule.list, surface: http, method: GET, path: /v1/maintenance-schedules, resource: maintenance-schedule,
     module: local_observe/platform/maintenance_api.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite maintenance_schedules (schema v12)", status: implemented, owner_area: maintenance,
     notes: "Current version of every schedule by state, counting rows this build cannot read rather than dropping them."}
  - {operation_id: maintenance.schedule.read, surface: http, method: GET, path: "/v1/maintenance-schedules/{id}", resource: maintenance-schedule,
     module: local_observe/platform/maintenance_api.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite maintenance_schedules (schema v12) + notification_control", status: implemented, owner_area: maintenance,
     notes: "The current version, its version list, the occurrences still to come and the horizon already materialized. Reports what has been declared; never declares anything."}
  - {operation_id: maintenance.schedule.history.read, surface: http, method: GET, path: "/v1/maintenance-schedules/{id}/history", resource: maintenance-schedule,
     module: local_observe/platform/maintenance_api.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite maintenance_schedules (schema v12) + audit attestation", status: implemented, owner_area: maintenance,
     notes: "Every version of a plan, each with whether a human attests it — the answer to what the plan said in October, read in November."}
  - {operation_id: maintenance.schedule.revise, surface: http, method: PATCH, path: "/v1/maintenance-schedules/{id}", resource: maintenance-schedule,
     module: local_observe/platform/maintenance_api.py, access: write, required_role: [human],
     side_effects: "a new maintenance_schedules version, revocations of the plan's unstarted windows from earlier versions, new windows for the slice after the edit", state_source: "sqlite maintenance_schedules (schema v12) + notification_control", status: implemented, owner_area: maintenance,
     notes: "The transport's only PATCH. Conditional: `expected_version` is required and a mismatch answers 412. Edits append — a window already running is left exactly as it was, and the version it was declared under stays readable."}
  - {operation_id: maintenance.schedule.cancel, surface: http, method: POST, path: "/v1/maintenance-schedules/{id}/cancellations", resource: maintenance-schedule,
     module: local_observe/platform/maintenance_api.py, access: write, required_role: [human],
     side_effects: "a cancelled version plus revocations of every unstarted window the plan declared", state_source: "sqlite maintenance_schedules (schema v12) + notification_control", status: implemented, owner_area: maintenance,
     notes: "Cancelling a plan cancels its future, not its past: windows that already ran keep their rows and their outcomes."}
  - {operation_id: maintenance.schedule.materialize, surface: http, method: POST, path: "/v1/maintenance-schedules/{id}/materializations", resource: maintenance-schedule,
     module: local_observe/platform/maintenance_api.py, access: write, required_role: [human],
     side_effects: "windows for the next bounded slice of occurrences, one audit row naming the slice", state_source: "sqlite maintenance_schedules (schema v12) + notification_control", status: implemented, owner_area: maintenance,
     notes: "Roll-forward is a human write, not a timer: at most MAX_MATERIALIZED_OCCURRENCES occurrences per pass, never more than 35 days ahead. A scheduled job that signs declarations would put a machine's name on a silence."}
  - {operation_id: maintenance.interval.read, surface: http, method: GET, path: /v1/maintenance-intervals, resource: maintenance-interval,
     module: local_observe/platform/maintenance_api.py, access: read, required_role: [reader, proposer, human, executor],
     side_effects: none, state_source: "sqlite notification_control (history read), maintenance_schedules, incidents", status: implemented, owner_area: maintenance,
     notes: "Two questions in one route: `resource|service|rule` with `from` and `to` gives the bounded history of what was quiet and why; the same scope with `at` (optional `class`) classifies one instant — planned, outside or unknown — which is how a late fact reaches the window that planned it."}
  - {operation_id: maintenance.window.list, surface: cli, method: read, path: "python -m local_observe.platform.suppression windows", resource: maintenance-window,
     module: local_observe/platform/suppression.py, access: read, required_role: [local],
     side_effects: none, state_source: "sqlite notification_control + audit attestation", status: implemented, owner_area: maintenance,
     notes: "Names every live window and whether its attestation can be trusted."}
  - {operation_id: maintenance.decision.inspect, surface: cli, method: read, path: "python -m local_observe.platform.suppression inspect", resource: suppression-decision,
     module: local_observe/platform/suppression.py, access: read, required_role: [local],
     side_effects: none, state_source: "sqlite + optional built index for dependency suppression", status: implemented, owner_area: maintenance,
     notes: "Answers 'would this finding page?' and files nothing."}
  - {operation_id: maintenance.stats.read, surface: cli, method: read, path: "python -m local_observe.platform.suppression stats", resource: suppression-decision,
     module: local_observe/platform/suppression.py, access: read, required_role: [local],
     side_effects: none, state_source: "sqlite events, incidents, incident_members", status: implemented, owner_area: maintenance}

  # ------------------------------------------------------------------------------------------
  # resources-queries-rules-config — declarations, the built index, queries, rule documents
  # ------------------------------------------------------------------------------------------
  - {operation_id: resource.inventory.read, surface: http, method: GET, path: /v1/inventory, resource: resource,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "built inventory index (read-only SQLite)", status: implemented, owner_area: resources-queries-rules-config,
     notes: "100 rows, ordered by name, each with its display projection. Served only when an index is configured."}
  - {operation_id: resource.declaration.validate, surface: cli, method: run, path: "lo-inventory validate <declarations>", resource: resource,
     module: local_observe/inventory/validation.py, access: read, required_role: [local],
     side_effects: none, state_source: "declared YAML", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.index.build, surface: cli, method: run, path: "lo-inventory build", resource: resource-index,
     module: local_observe/inventory/index.py, access: write, required_role: [local],
     side_effects: "a new SQLite index file, atomically replacing the served snapshot", state_source: "declared YAML", status: implemented, owner_area: resources-queries-rules-config,
