     side_effects: none, state_source: "as the list above", status: implemented, owner_area: administration,
     notes: "One identity's row. An id this installation never mounted answers 404 with the same bytes as a typo of one it did, and the list above is readable by the same credential anyway, so nothing here is an oracle."}
  - {operation_id: administration.credential.revoke, surface: http, method: POST, path: "/v1/credentials/{identity}/revocations", resource: credential,
     module: local_observe/platform/administration.py, access: write, required_role: [human],
     side_effects: "one durable revocation row, one audit row; the bearer is refused from the next request", state_source: "sqlite: credential_revocations (schema v14)", status: implemented, owner_area: administration,
     notes: "Honours Idempotency-Key: a retry of a lost response returns the same revocation and does not spend a second audit row. It is a deny-list, not enrollment: the mounted role file stays the only statement of who may call, an identity with two mounted bearers is revoked as one unit because the mount names no finer reference, and there is no un-revoke route — restoring a revoked bearer would be a route that can hand back a leaked token."}
