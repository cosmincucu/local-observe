     side_effects: "the pre-migration verified copy, then one audited transaction per step", state_source: "sqlite user_version", status: implemented, owner_area: administration,
     notes: "Offline bootstrap and recovery step one: an older file is refused until this runs, and an older binary needs the copy rather than a downgrade. The migration is what an older file must be brought to before this build will open it, so the service that would run it is the service that refuses to start. CLI equivalent: lo-platform --database <path> migrate, after its own verified pre-migration copy.",
     no_http: offline_bootstrap}
