  - {operation_id: administration.state.backup, surface: cli, method: run, path: "lo-platform --database <path> backup --output <file>", resource: state,
     module: local_observe/platform/state.py, access: write, required_role: [local],
     side_effects: "one new file, integrity-checked; an existing destination is never replaced", state_source: "sqlite online backup API", status: implemented, owner_area: administration,
     notes: "The copy a rollback restores from. `Store.backup` reads the file back through SQLite's own `integrity_check` before it reports success, and `lo-platform migrate` writes its own verified pre-migration copy beside the file it is about to change — the recovery half of a schema change is that copy, never a digest rollback. The offline form names its own destination and is the one that survives a dead volume; the HTTP job copies beside the state file and reports the name, the size and the sha256.",
     http_via: [administration.state.backup_request]}
