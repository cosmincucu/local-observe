     notes: "The retired LO_PLATFORM_CREDENTIALS_JSON environment form is a boot refusal, not a fallback: a token in an environment value is visible in docker inspect and /proc. Enrollment is the boot precondition: the service refuses to start on a short, repeated or role-sick list, so no route could be reached to fix the list it depends on. CLI equivalent: mount the role file named by LO_PLATFORM_CREDENTIALS. What the API does carry is the read of that list and a durable revocation (`GET /v1/credentials`, `POST /v1/credentials/{identity}/revocations`) — see the note on why minting stays offline.",
