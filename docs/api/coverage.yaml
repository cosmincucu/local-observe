     notes: "The CLI sends only from a session armed by a human at the machine: it requires a TTY, prints the session identifier and refuses until the operator types it back, and it holds the channel token, acceptance and report as protected files the API does not have. What a browser can do about that session is on the list: read it, reconcile it, disarm it. CLI: `lo-observer deliver <cycle_id>`."}
