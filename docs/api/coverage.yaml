  - {operation_id: administration.state.backup_request, surface: http, method: POST, path: /v1/state/backups, resource: state,
     module: local_observe/platform/administration.py, access: write, required_role: [human],
     side_effects: "one durable job row now; the verified copy, its audit rows and one new file when the delivery loop runs it", state_source: "sqlite: platform_jobs (schema v14), then the sqlite online backup API", status: implemented, owner_area: administration,
     notes: "Answers 202 with a job id and no receipt, because the copy has not happened. `approval` must name the digest just read from /v1/state/backup-plan or the write is 412. Honours Idempotency-Key, so a caller that lost the 202 replays its own job id instead of booking a second file. The copy lands beside the state file and the answer names it; the bytes leave by the operator's own file access, because this transport carries no state dump."}
  - {operation_id: administration.state.verification_request, surface: http, method: POST, path: /v1/state/verifications, resource: state,
