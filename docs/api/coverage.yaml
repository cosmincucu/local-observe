# Capability census: every operation this product supports, and the one that is planned next.
#
# One row per operation. `docs/api/COVERAGE.md` explains each column, `docs/api/openapi.yaml` is the
# contract for the rows whose `surface` is `http` and whose `status` is `implemented`, and
# `tests/test_api_coverage.py` fails when a row, the OpenAPI document and the served routes disagree.
#
# Flow style is deliberate: 120 rows in block style would be 1 200 lines a reviewer cannot scan, and a
# row is one sentence, not a tree.
schema_version: 1
updated: "2026-10-30"

# The closed vocabularies a row must choose from. The test reads them from here, so a new value is a
# change to this file first and never a one-off spelling in a row.
vocabularies:
  surfaces: [http, cli, mcp, ui]
  access: [read, write]
  status: [implemented, planned, excluded]
  owner_areas:
    - foundation
    - occurrences
    - maintenance
    - resources-queries-rules-config
    - investigations-notifications-actions
    - administration
  # For an http row this names the credential role a bearer must carry. For cli, mcp and ui rows it
  # names the authority the surface reaches: `local` is the operator's own file access, `bearer` is a
  # mounted credential the caller holds, `none` is deliberately unauthenticated.
  authority: [reader, producer, proposer, human, executor, summary, local, bearer, none]
  # Which artifact is expected to describe this row. `openapi` means docs/api/openapi.yaml must carry the
  # same operationId under the same path and method; `none` means the row is a cross-cutting rule, a
  # third-party surface or a browser-side render, and no OpenAPI operation is owed for it. A row with no
  # `contract` key is treated as `openapi` when its surface is http and its path is a single route.
  contract: [openapi, none]

operations:
  # ------------------------------------------------------------------------------------------
  # foundation — identity, health, the transport boundary itself
  # ------------------------------------------------------------------------------------------
  - {operation_id: platform.identity.read, surface: http, method: GET, path: /v1/me, resource: identity,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor, summary],
     side_effects: none, state_source: "credential file (no database read)", status: implemented, owner_area: foundation,
     notes: "The only route a summary credential may call besides /v1/overview; it answers who the bearer is."}
  - {operation_id: platform.status.read, surface: http, method: GET, path: /v1/status, resource: platform,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite: incidents, actions, outbox counts", status: implemented, owner_area: foundation}
  - {operation_id: platform.runtime.read, surface: http, method: GET, path: /v1/runtime, resource: platform,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "startup filesystem snapshot, in-process delivery/refusal counters", status: implemented, owner_area: foundation,
     notes: "Process-local counters reset when the process does; they are not durable history."}
  - {operation_id: platform.overview.read, surface: http, method: GET, path: /v1/overview, resource: portal-summary,
     module: local_observe/platform/overview.py, access: read, required_role: [reader, producer, proposer, human, executor, summary],
     side_effects: none, state_source: "sqlite counts, optional overview document", status: implemented, owner_area: foundation,
     notes: "Portal summary v1 (docs/CONTRACTS.md). Unknown, disabled and stale observations carry null values."}
  - {operation_id: platform.audit.read, surface: http, method: GET, path: /v1/audit, resource: audit,
     module: local_observe/platform/audit_reader.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite audit table, read-only connection", status: implemented, owner_area: administration,
     notes: "Bounded page over append-only history; the parser refuses before any file is opened."}
  - {operation_id: platform.openapi.read, surface: http, method: GET, path: /v1/openapi.json, resource: api-contract,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "docs/api/openapi.yaml, shipped as package data", status: planned, owner_area: foundation,
     notes: "Serving the contract is a separate decision: it publishes the route table to every caller that can reach the port, and F1 ships the document without the route."}
  - {operation_id: foundation.request_identity.apply, surface: http, method: GET, path: "any /v1 route", resource: api-contract,
     module: local_observe/platform/api_contract.py, access: read, required_role: [reader, producer, proposer, human, executor, summary],
     side_effects: none, state_source: none, status: implemented, owner_area: foundation, contract: none,
     notes: "Cross-cutting: one x-request-id per request, echoed on every answer and carried into the server-side log line. It is a rule over every route, not an addressable operation."}
  - {operation_id: foundation.idempotent_write.apply, surface: http, method: POST, path: "the routes listed in api.IDEMPOTENT_POST_ROUTES", resource: api-contract,
     module: local_observe/platform/api_contract.py, access: write, required_role: [producer, proposer, human, executor],
     side_effects: "one api_idempotency row per keyed write", state_source: "sqlite: api_idempotency (schema v11)", status: implemented, owner_area: foundation, contract: none,
     notes: "Opt-in by header. A route not listed ignores the header, so no client that exists today changes behaviour. Each keyed route is documented in its own row."}

  # ------------------------------------------------------------------------------------------
  # occurrences — findings, incidents, escalation of an unanswered one
  # ------------------------------------------------------------------------------------------
  - {operation_id: incident.records.read, surface: http, method: GET, path: "/v1/records/{table}", resource: incident,
     module: local_observe/platform/presentation.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite: events, incidents, actions, executions, audit, outbox, notification_attempts", status: implemented, owner_area: occurrences,
     notes: "One capped newest-first window over a closed table list; secret columns are dropped on read."}
  - {operation_id: occurrence.create, surface: http, method: POST, path: /v1/events, resource: occurrence,
     module: local_observe/platform/state.py, access: write, required_role: [producer],
     side_effects: "event, condition, incident, outbox and audit rows; a grouping link when the declared graph agrees", state_source: "sqlite operational store", status: implemented, owner_area: occurrences,
     notes: "Canonical event admission. Idempotent by (source, source_event_id), which is why it takes no Idempotency-Key."}
  - {operation_id: occurrence.intake, surface: http, method: POST, path: "/v1/intake/{source}", resource: occurrence,
     module: local_observe/platform/intake.py, access: write, required_role: [producer],
     side_effects: "evidence rows and admitted events, in payload order; audit rows", state_source: "sqlite operational store, optional built index for linking", status: implemented, owner_area: occurrences,
     notes: "External envelopes (Alertmanager today, CrowdSec beside it) are normalised here or become a coverage event. The path must name the caller's own identity."}
  - {operation_id: evidence.sample.create, surface: http, method: POST, path: /v1/evidence, resource: evidence,
     module: local_observe/platform/state.py, access: write, required_role: [producer],
     side_effects: "one bounded evidence row with a 15-day expiry", state_source: "sqlite evidence table", status: implemented, owner_area: occurrences,
     notes: "Honours Idempotency-Key: a producer that lost the answer reads its own evidence id back."}
  - {operation_id: evidence.sample.read, surface: http, method: GET, path: /v1/evidence, resource: evidence,
     module: local_observe/platform/state.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite evidence table", status: implemented, owner_area: occurrences,
     notes: "Answers available, expired or unavailable — an expired sample was real and is gone."}
  - {operation_id: occurrence.escalate, surface: cli, method: run, path: "lo-platform escalate", resource: occurrence,
     module: local_observe/platform/escalation.py, access: write, required_role: [local],
     side_effects: "one stage event per rung advanced, and the delivery it books", state_source: "sqlite + the producer's own cursor file", status: implemented, owner_area: occurrences,
     notes: "Files an event; never sends a notification itself."}
  - {operation_id: occurrence.history.read, surface: cli, method: read, path: "lo-platform --database <path> status", resource: occurrence,
     module: local_observe/platform/state.py, access: read, required_role: [local],
     side_effects: none, state_source: "sqlite counts", status: implemented, owner_area: occurrences}
  - {operation_id: occurrence.list, surface: http, method: GET, path: /v1/occurrences, resource: occurrence,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite: incidents, conditions, acknowledgement state", status: planned, owner_area: occurrences,
     notes: "Milestone F2. Bounded page over open occurrences with the acknowledgement state beside each row."}
  - {operation_id: occurrence.acknowledge, surface: http, method: POST, path: /v1/occurrences/acknowledge, resource: occurrence,
     module: local_observe/platform/api.py, access: write, required_role: [human],
     side_effects: "acknowledgement state on the incident, one audit row, the escalation that stops", state_source: "sqlite operational store", status: planned, owner_area: occurrences,
     notes: "Milestone F2. Today an acknowledgement exists only as the action.approval_intent a callback carries; there is no HTTP verb for 'a human has seen this'."}
  - {operation_id: occurrence.dismiss, surface: http, method: POST, path: /v1/occurrences/dismiss, resource: occurrence,
     module: local_observe/platform/api.py, access: write, required_role: [human],
     side_effects: "closed occurrence state, one audit row, no re-open on the next replay of the same verdict", state_source: "sqlite operational store", status: planned, owner_area: occurrences,
     notes: "Milestone F2. Dismissal is a human judgement about a verdict this platform holds; it must not resolve the underlying condition, which belongs to a recovery event or a cleared verification."}
  - {operation_id: occurrence.acknowledge.mcp, surface: mcp, method: tool, path: planned, resource: occurrence,
     module: local_observe/platform/tools.py, access: write, required_role: [bearer],
     side_effects: "as the HTTP route, attributed to the agent that called", state_source: "sqlite operational store", status: excluded, owner_area: occurrences,
     notes: "Excluded on purpose: §5 says a payload field cannot claim that an agent is a human, and an acknowledgement is exactly that claim. An agent may read and propose; only a human credential may acknowledge."}

  # ------------------------------------------------------------------------------------------
  # maintenance — declared windows, suppression, flap accounting
  # ------------------------------------------------------------------------------------------
  - {operation_id: maintenance.window.declare_cli, surface: cli, method: run, path: "python -m local_observe.platform.suppression (no declare command)", resource: maintenance-window,
     module: local_observe/platform/suppression.py, access: write, required_role: [local],
     side_effects: "none available from a command line", state_source: "sqlite notification_control", status: excluded, owner_area: maintenance,
     notes: "The read-only CLI refuses to declare: minting Actor(identity,'human') from a flag would claim a role the caller never proved. declare_window is reached by a caller holding a real human actor."}
  - {operation_id: maintenance.window.declare, surface: http, method: POST, path: /v1/maintenance/windows, resource: maintenance-window,
     module: local_observe/platform/suppression.py, access: write, required_role: [human],
     side_effects: "one maintenance:<id> control document, one maintenance.declared audit row it is attested against", state_source: "sqlite notification_control", status: planned, owner_area: maintenance,
     notes: "Milestone F2. The library call, its bounds and its attested read exist; the HTTP write route is the missing half `suppression.main` names as a follow-up."}
  - {operation_id: maintenance.window.revoke, surface: http, method: POST, path: /v1/maintenance/windows/revoke, resource: maintenance-window,
     module: local_observe/platform/suppression.py, access: write, required_role: [human],
     side_effects: "revoked marker on the control document plus its audit row; a live window stops covering immediately", state_source: "sqlite notification_control", status: planned, owner_area: maintenance,
     notes: "Milestone F2. Revoke is a separate operation from declare because a revocation must be legible in the audit history on its own."}
  - {operation_id: maintenance.window.read, surface: http, method: GET, path: /v1/maintenance/windows, resource: maintenance-window,
     module: local_observe/platform/suppression.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite notification_control", status: planned, owner_area: maintenance,
     notes: "Milestone F2. The same `live_windows` answer the CLI gives, over the credential the platform already issues."}
  - {operation_id: maintenance.window.list, surface: cli, method: read, path: "python -m local_observe.platform.suppression windows", resource: maintenance-window,
     module: local_observe/platform/suppression.py, access: read, required_role: [local],
     side_effects: none, state_source: "sqlite notification_control + audit attestation", status: implemented, owner_area: maintenance,
     notes: "Names every live window and whether its attestation can be trusted."}
  - {operation_id: maintenance.decision.inspect, surface: cli, method: read, path: "python -m local_observe.platform.suppression inspect", resource: suppression-decision,
     module: local_observe/platform/suppression.py, access: read, required_role: [local],
     side_effects: none, state_source: "sqlite + optional built index for dependency suppression", status: implemented, owner_area: maintenance,
     notes: "Answers 'would this finding page?' and files nothing."}
  - {operation_id: maintenance.stats.read, surface: cli, method: read, path: "python -m local_observe.platform.suppression stats", resource: suppression-decision,
     module: local_observe/platform/suppression.py, access: read, required_role: [local],
     side_effects: none, state_source: "sqlite events, incidents, incident_members", status: implemented, owner_area: maintenance}

  # ------------------------------------------------------------------------------------------
  # resources-queries-rules-config — declarations, the built index, queries, rule documents
  # ------------------------------------------------------------------------------------------
  - {operation_id: resource.inventory.read, surface: http, method: GET, path: /v1/inventory, resource: resource,
     module: local_observe/platform/api.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "built inventory index (read-only SQLite)", status: implemented, owner_area: resources-queries-rules-config,
     notes: "100 rows, ordered by name, each with its display projection. Served only when an index is configured."}
  - {operation_id: resource.declaration.validate, surface: cli, method: run, path: "lo-inventory validate <declarations>", resource: resource,
     module: local_observe/inventory/validation.py, access: read, required_role: [local],
     side_effects: none, state_source: "declared YAML", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.index.build, surface: cli, method: run, path: "lo-inventory build", resource: resource-index,
     module: local_observe/inventory/index.py, access: write, required_role: [local],
     side_effects: "a new SQLite index file, atomically replacing the served snapshot", state_source: "declared YAML", status: implemented, owner_area: resources-queries-rules-config,
     notes: "The derived index is rebuildable and never holds approvals."}
  - {operation_id: resource.alias.resolve, surface: cli, method: read, path: "lo-inventory resolve", resource: resource,
     module: local_observe/inventory/index.py, access: read, required_role: [local],
     side_effects: none, state_source: "built index", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.dependents.read, surface: cli, method: read, path: "lo-inventory dependents", resource: resource,
     module: local_observe/topology.py, access: read, required_role: [local],
     side_effects: none, state_source: "built index", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.observation.record, surface: cli, method: run, path: "lo-inventory observe", resource: observed-resource,
     module: local_observe/inventory/discovery.py, access: write, required_role: [local],
     side_effects: "observed rows with source and observed_at; declarations are never edited", state_source: "observed dataset", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.drift.evaluate, surface: cli, method: run, path: "lo-inventory drift", resource: observed-resource,
     module: local_observe/inventory/validation.py, access: read, required_role: [local],
     side_effects: none, state_source: "built index + observed dataset", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.proposal.build, surface: cli, method: run, path: "lo-inventory propose", resource: resource,
     module: local_observe/inventory/forge.py, access: write, required_role: [local],
     side_effects: "one proposal document on disk; no declaration is edited", state_source: "built index + observed dataset", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.discovery.docker, surface: cli, method: run, path: "lo-inventory discover-docker", resource: observed-resource,
     module: local_observe/inventory/docker_provider.py, access: write, required_role: [local],
     side_effects: "observations from one allowlisted socket read", state_source: "docker daemon socket, observed dataset", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.proposal.publish, surface: cli, method: run, path: "lo-inventory publish-proposal", resource: resource,
     module: local_observe/inventory/forge.py, access: write, required_role: [local],
     side_effects: "one reviewed proposal sent to a named repository", state_source: "proposal document", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.query.series, surface: mcp, method: tool, path: signal_series, resource: signal-sample,
     module: local_observe/platform/tools.py, access: read, required_role: [reader],
     side_effects: none, state_source: "ClickHouse through the bounded read-only client", status: implemented, owner_area: resources-queries-rules-config,
     notes: "No query text, table or statement is accepted; an empty window says so in rows and error."}
  - {operation_id: resource.query.topology, surface: mcp, method: tool, path: topology_neighbourhood, resource: resource,
     module: local_observe/platform/tools.py, access: read, required_role: [reader],
     side_effects: none, state_source: "built index", status: implemented, owner_area: resources-queries-rules-config,
     notes: "Names which bound cut the answer off in truncated_by."}
  - {operation_id: resource.inventory.mcp, surface: mcp, method: tool, path: inventory, resource: resource,
     module: local_observe/platform/tools.py, access: read, required_role: [reader],
     side_effects: none, state_source: "built index", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: resource.dataset.read, surface: http, method: GET, path: "planned (third-party Datasette surface)", resource: resource,
     module: local_observe/inventory/api.py, access: read, required_role: [bearer],
     side_effects: none, state_source: "built index, immutable", status: implemented, owner_area: resources-queries-rules-config, contract: none,
     notes: "The read-only Datasette/GraphQL reference app: SQL execution, downloads and CSV streaming are off, pages are capped. Its route shapes belong to Datasette, not to this product, so they are not written into docs/api/openapi.yaml."}
  - {operation_id: rule.detection.evaluate, surface: cli, method: run, path: "lo-platform evaluate", resource: rule,
     module: local_observe/platform/detections.py, access: write, required_role: [local],
     side_effects: "one verdict event per condition, with its evidence sample", state_source: "rule document, samples, built index", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: rule.sustained.evaluate, surface: cli, method: run, path: "lo-platform conditions", resource: rule,
     module: local_observe/platform/conditions.py, access: write, required_role: [local],
     side_effects: "firing/clear events and the producer's own cursor", state_source: "rule document, cursor, built index", status: implemented, owner_area: resources-queries-rules-config,
     notes: "Static tiers, absence rules and learned bands. Off unless a document is named."}
  - {operation_id: rule.config_drift.evaluate, surface: cli, method: run, path: "lo-platform drift", resource: rule,
     module: local_observe/platform/configdrift.py, access: write, required_role: [local],
     side_effects: "drift events filed under the source identity named", state_source: "snapshot tree, cursor, built index", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: rule.pathcheck.evaluate, surface: cli, method: run, path: "lo-platform pathcheck", resource: rule,
     module: local_observe/platform/pathcheck.py, access: write, required_role: [local],
     side_effects: "availability/coverage events and the replay-carrying cursor", state_source: "probe reports, cursor, built index", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: rule.slo.evaluate, surface: cli, method: run, path: "lo-platform slo", resource: rule,
     module: local_observe/slo/alerts.py, access: write, required_role: [local],
     side_effects: "threshold events for attainment and the fast-burn pair, plus the cursor", state_source: "objectives document, ClickHouse, built index", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: rule.forecast.evaluate, surface: cli, method: run, path: "lo-platform forecast", resource: rule,
     module: local_observe/forecast/timetothreshold.py, access: write, required_role: [local],
     side_effects: ".predicted conditions and the cursor", state_source: "rules document, ClickHouse, built index", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: rule.sigma.compile, surface: cli, method: run, path: "lo-platform --help shows no compile verb; the compiler is a library and a pinned tier", resource: rule,
     module: local_observe/platform/sigma_compile.py, access: read, required_role: [local],
     side_effects: none, state_source: "Sigma rules and the field mapping", status: implemented, owner_area: resources-queries-rules-config,
     notes: "build_gate refuses any nonempty input-binding declaration until input binding exists."}
  - {operation_id: config.deployment.render, surface: cli, method: run, path: "lo-deployment render", resource: deployment-config,
     module: local_observe/deployment/content.py, access: write, required_role: [local],
     side_effects: "rendered configuration under the chosen output directory", state_source: "content lock and overlays", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: config.deployment.plan, surface: cli, method: run, path: "lo-deployment plan", resource: deployment-config,
     module: local_observe/deployment/release.py, access: write, required_role: [local],
     side_effects: "one drift-aware upgrade plan", state_source: "content lock and live state", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: config.deployment.lock, surface: cli, method: run, path: "lo-deployment lock", resource: deployment-config,
     module: local_observe/deployment/content.py, access: write, required_role: [local],
     side_effects: "a draft content lock for review; fetches and trusts nothing", state_source: "declared content", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: config.deployment.export, surface: cli, method: run, path: "lo-deployment export-storage|export-signoz|export-homepage|export-dashboard", resource: deployment-config,
     module: local_observe/deployment/dashboard_review.py, access: write, required_role: [local],
     side_effects: "exported artifacts for review in the operator's own repository", state_source: "rendered configuration", status: implemented, owner_area: resources-queries-rules-config}
  - {operation_id: config.notification_policy.read, surface: http, method: GET, path: /v1/notifications/safety, resource: notification-policy,
     module: local_observe/platform/notification_safety.py, access: read, required_role: [reader, producer, proposer, human, executor],
     side_effects: none, state_source: "sqlite notification_control", status: implemented, owner_area: investigations-notifications-actions}

  # ------------------------------------------------------------------------------------------
  # investigations-notifications-actions — observer, notifications, action lifecycle, verification
  # ------------------------------------------------------------------------------------------
  - {operation_id: investigation.run, surface: cli, method: run, path: "lo-observer run", resource: investigation,
     module: local_observe/observer/runtime.py, access: write, required_role: [local],
     side_effects: "one bounded cycle: journal rows, retained redacted evidence, delivery state", state_source: "observer journal (private 0700 directory)", status: implemented, owner_area: investigations-notifications-actions}
  - {operation_id: investigation.serve, surface: cli, method: run, path: "lo-observer serve", resource: investigation,
     module: local_observe/observer/runtime.py, access: write, required_role: [local],
     side_effects: "scheduled cycles on the same journal", state_source: "observer journal", status: implemented, owner_area: investigations-notifications-actions}
  - {operation_id: investigation.replay, surface: cli, method: run, path: "lo-observer replay <cycle_id>", resource: investigation,
     module: local_observe/observer/journal.py, access: write, required_role: [local],
     side_effects: "a re-run of one recorded cycle; the original record stays", state_source: "observer journal", status: implemented, owner_area: investigations-notifications-actions}
  - {operation_id: investigation.check, surface: cli, method: read, path: "lo-observer check", resource: investigation,
     module: local_observe/observer/journal.py, access: read, required_role: [local],
     side_effects: none, state_source: "observer journal", status: implemented, owner_area: investigations-notifications-actions}
  - {operation_id: investigation.feedback.record, surface: cli, method: run, path: "lo-observer feedback <cycle_id>", resource: investigation-review,
     module: local_observe/observer/journal.py, access: write, required_role: [local],
     side_effects: "one versioned human correction; the model's own claim is never rewritten", state_source: "observer journal", status: implemented, owner_area: investigations-notifications-actions}
  - {operation_id: investigation.retrieve, surface: cli, method: read, path: "lo-observer retrieve", resource: investigation,
     module: local_observe/observer/journal.py, access: read, required_role: [local],
     side_effects: none, state_source: "observer journal (eligible corrected cases)", status: implemented, owner_area: investigations-notifications-actions}
