     notes: "The follower's own write already has a route — `POST /v1/verification/records` is what it posts through. What cannot become a route is its read side: it queries the telemetry backend with credentials mounted for itself, and a route that ran those queries would be an unvalidated query proxy holding a store credential. CLI: `lo-platform verify-follow`."}
