  - {operation_id: investigation.serve.http, surface: http, method: POST, path: planned, resource: investigation,
     module: local_observe/observer/runtime.py, access: write, required_role: [human],
     side_effects: "a second long-lived scheduler per installation, each with its own cadence", state_source: "observer journal", status: excluded, owner_area: investigations-notifications-actions,
     notes: "A route starts a request and answers it; `lo-observer serve` is the long-lived scheduler and the flock that makes one observer the active one. A `POST /v1/observer/serve` would either fork a process the transport cannot supervise or serve cycles on the request thread, and it would replace the one lock that guarantees a single writer. CLI: `lo-observer serve --state <dir> --config <file>`."}
  - {operation_id: investigation.quality.accept.http, surface: http, method: POST, path: planned, resource: investigation-quality,
     module: local_observe/observer/acceptance.py, access: write, required_role: [human],
     side_effects: "one acceptance receipt written as the OS account that re-verifies it on every send", state_source: "protected files + observer journal", status: excluded, owner_area: investigations-notifications-actions,
     notes: "`accept_quality` reads a measured report of up to 4 MiB from a protected file the caller's OS account must own, recomputes every arm of it, and records the accepting party as `os-uid:<uid>` — the identity `AcceptedQuality.verify` re-checks before any send. A route would need either a network-supplied path (a file-read primitive) or a body this transport refuses to read that large, and its receipt would be a second, weaker writer of delivery authority. CLI: `lo-observer quality-accept`, withdrawn by `quality-revoke`."}
