        source's newest snapshot must be fresh and successful, the observation must be named, typed and free of
        credential material, and its aliases must resolve to *nothing* — a proposal exists only for an identity
        the declarations do not claim. A `400` carries the module's own sentence, because all three are facts
        the caller can act on.

        **The caller never names a path.** The document lands under the mounted proposal directory named by the
        digest of `(source, observation_id)`, so retrying one body re-reads one file and a body cannot steer a
        proposal somewhere this process was not given. The answer carries `published: false` and
        `declared: false`: this route drafts, a human reviews, and the outbound half stays on
        `lo-inventory publish-proposal` (`resource.proposal.publish`).
      parameters:
