# The platform HTTP contract, OpenAPI 3.1.
#
# Every operation served by `local_observe.platform.api:create_app` and the three seams it hands paths to
# (`verification_api`, `observer_review`, `maintenance_api`), plus the operator shell in `operator.py`. Accuracy rule for
# this file: a response schema is what the code returns, and where a body is a documented superset (a
# runtime snapshot, a record row) that is said in the description rather than hidden behind `{}`.
#
# `x-status` is not an OpenAPI keyword; it is this product's. `implemented` means a request reaches a
# handler; `planned` means the document proposes the shape and the transport answers 404 for it today.
# `x-required-role` names the credential roles that may call — `tests/test_api_openapi_conformance.py`
# fails when the list here, the list in `docs/api/coverage.yaml`, and the gate in the code disagree.
openapi: 3.1.0
info:
  title: local-observe platform API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Authenticated JSON surface for incidents, actions, notifications, evidence and review.

    * One bearer credential per caller, assigned one of six server-side roles: `reader`, `producer`,
      `proposer`, `human`, `executor`, `summary`. A body never names an actor (§5 of `docs/CONTRACTS.md`).
    * Two verbs carry everything: `GET` reads, `POST` writes. One route also answers `PATCH` —
      `/v1/maintenance-schedules/{id}`, where an edit appends a version and a `POST` would mean a second
      plan. Every other verb on every other path is answered `405`.
    * Answers before the envelope existed keep the flat shape `{"error": "<code>", "detail": "<sentence>"}`.
      Answers produced through the shared boundary use `{"error": {"code", "message", "request_id"}}`, and
      `X-Request-Id` is echoed on every response, including the flat ones. `tests/test_api_errors.py` pins
      the flat bodies; changing them is a compatibility decision, not a cleanup.
    * Bodies are limited to 64 KiB, refused whole with `413 body_too_large` by the chunk that crosses the
      bound.
    * Six refusals belong to the transport and not to any handler, so `x-transport-errors` below states
      them once for every `/v1` operation instead of repeating six entries forty times. A handler's own
      refusals are listed per operation.
servers:
  - url: http://127.0.0.1:18083
    description: |
      The reference component — `components/control/platform/compose.yaml`, which publishes
      `127.0.0.1:${LO_PLATFORM_PORT:-18083}` onto the service's container port 8002. Loopback only: a LAN
      or wide address belongs to an installation overlay behind authenticated TLS, and this document can
      state the product default, not the operator's choice.
security:
  - bearerAuth: []
# The dispatcher's own answers, available on every `/v1` operation and produced before any handler runs.
# Stated once here because repeating them under all forty-nine operations would hide the handler-specific
# refusals that are the reason to read an operation entry. `tests/test_api_openapi_conformance.py` treats
# these as documented for `/v1` operations and proves each one really is answerable.
x-transport-errors:
  scope: every path beginning /v1
  responses:
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/SummaryOnly'
    '404':
      $ref: '#/components/responses/NotFound'
    '405':
      $ref: '#/components/responses/MethodNotAllowed'
    '413':
      $ref: '#/components/responses/BodyTooLarge'
    '500':
      $ref: '#/components/responses/InternalError'
tags:
  - name: identity
    description: Who a credential is.
  - name: health
    description: What this process and this database say about themselves.
  - name: occurrences
    description: Canonical events, external envelopes, evidence and incidents.
  - name: actions
    description: The approval lifecycle — proposed, pending, approved/denied/expired, executing, outcome.
  - name: notifications
    description: The delivery outbox, its safety gates and its single-use callbacks.
  - name: verification
    description: The post-action verdict a verifier submits and the server derives.
  - name: observer
    description: Bounded investigations and the human review of them.
  - name: setup
    description: Guided setup plans, human decisions and the trusted runner handoff.
  - name: operator
    description: The static shell and the one question it may ask without a credential.
  - name: maintenance
    description: Declared silences, the plans that repeat them, and what became of each.
  - name: resources
    description: >-
      The declared and observed planes: what a declaration says, what a prober saw, how far apart they are,
      and what a proposal to close the gap would say.
  - name: queries
    description: >-
      The two reads the inventory MCP surface has always had — one bounded signal window and one declared
      neighbourhood — plus the document that says which operations this installation can answer.
  - name: rules
    description: >-
      What a rule of each family says about a caller-supplied fixture. Every answer is a preview: nothing is
      filed, no cursor moves, and no state changes.
  - name: config
    description: >-
      The pure deployment functions — a draft lock, a content plan, a rendered tree, a dashboard review
      document. Bytes to read, never a change to apply.
paths:
  /v1/me:
    get:
      tags: [identity]
      operationId: platform.identity.read
      x-status: implemented
      x-required-role: [reader, producer, proposer, human, executor, summary]
      summary: Return the identity and role this credential carries.
      description: |
        Decided by the transport from the bearer token and nothing else. The one route besides
        `/v1/overview` a `summary` credential may read.
      responses:
        '200':
          description: The authenticated actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/status:
    get:
      tags: [health]
      operationId: platform.status.read
      x-status: implemented
      x-required-role: [reader, producer, proposer, human, executor]
      summary: Counts of incidents, actions and queued deliveries.
      description: |
        A count is not a health verdict and an absent status key means no row holds that status. The shape
        is pinned by `tests/test_regression_schema_version.py`.
      responses:
        '200':
          description: The current counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
  /v1/runtime:
    get:
      tags: [health]
      operationId: platform.runtime.read
      x-status: implemented
      x-required-role: [reader, producer, proposer, human, executor]
      summary: This process's startup snapshot, delivery-loop tally and refusal-audit counters.
      description: |
        Three sources in one body: a filesystem/module snapshot taken at startup, counters the delivery
        loop publishes as it runs, and the refusal-audit tallies (`refusal_audit` from the store's budget,
        `refusal_audit_dispatch` from this app instance's single slot). The counters are volatile — they
        reset when the process does, and `scope`/`resets_on_restart` say so in the body itself. A shed
        refusal is counted and has no row, so a 403 is never proof of a durable record.
      responses:
        '200':
          description: The runtime snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
  /v1/overview:
    get:
      tags: [health]
      operationId: platform.overview.read
      x-status: implemented
      x-required-role: [reader, producer, proposer, human, executor, summary]
      summary: The portal summary — durable counts plus freshness-qualified observations.
      description: |
        Portal summary v1. Unknown, disabled, stale and future-dated observations carry null values; a
        missing observation never implies zero failures or a verified backup. Job-count scope is explicit
        and may be a subset of the estate.
      responses:
        '200':
          description: The summary document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/audit:
    get:
      tags: [health]
      operationId: platform.audit.read
      x-status: implemented
      x-required-role: [reader, producer, proposer, human, executor]
      summary: One bounded page of the append-only audit history, newest first.
      description: |
        The query parser runs before the store is asked for anything, so a bad page request opens no
        connection. `snapshot` and `before` are a pair: a cursor naming only one is refused, and `omitted`
        marks a row the per-row width bound cut rather than a row that did not exist.
      parameters:
        - $ref: '#/components/parameters/AuditLimit'
        - $ref: '#/components/parameters/AuditCategory'
        - $ref: '#/components/parameters/AuditSnapshot'
        - $ref: '#/components/parameters/AuditBefore'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
  /v1/records/{table}:
    get:
      tags: [occurrences]
      operationId: incident.records.read
      x-status: implemented
      x-required-role: [reader, producer, proposer, human, executor]
      summary: One capped newest-first window over one named record table.
      description: |
        `table` is a closed list — `events`, `incidents`, `actions`, `executions`, `audit`, `outbox`,
        `notification_attempts` — and `limit` is 1..100, refused rather than clamped. Columns that hold a
        token or a token hash are removed before the page is built. Each row carries its stored document
        plus the display projection the deployment configured.
      parameters:
        - name: table
          in: path
          required: true
          description: One of the seven tables this surface exposes.
          schema:
            type: string
            enum: [events, incidents, actions, executions, audit, outbox, notification_attempts]
        - name: limit
          in: query
          required: false
          description: Newest rows to return, 1..100. A non-integer is refused; a value out of range is refused by the store.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: The window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordWindow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
  /v1/inventory:
    get:
      tags: [occurrences]
      operationId: resource.inventory.read
      x-status: implemented
      x-required-role: [reader, producer, proposer, human, executor]
      summary: The first 100 declared resources, by name.
      description: |
        Read from the rebuildable derived index, never from the operational store. Served only when this
        process was started with an index; without one the path is answered `404 not_found`.
      responses:
        '200':
          description: Declared rows with their display projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryWindow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/evidence:
    get:
      tags: [occurrences]
      operationId: evidence.sample.read
      x-status: implemented
      x-required-role: [reader, producer, proposer, human, executor]
      summary: Ask whether one stored evidence sample is available, expired or unavailable.
      description: |
        Three answers and they are not interchangeable: `expired` means the sample was real and its
        retention ended, `unavailable` means this platform never kept it. Both are answers, not errors.
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
        - name: sample_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The availability verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
    post:
      tags: [occurrences]
      operationId: evidence.sample.create
      x-status: implemented
      x-required-role: [producer]
      summary: File one bounded evidence sample.
      description: |
        A sample is `sample_id`, `observed_at`, `ok` and one scalar `value`, canonical to at most 2 KiB,
        expiring 15 days after its own observation. Re-filing the same sample from the same producer is a
        duplicate; re-filing the same id with different contents is a refusal, not an overwrite.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceSample'
      responses:
        '200':
          description: The stored sample's identifier.
          headers:
            X-Idempotency-Replayed:
              $ref: '#/components/headers/XIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceCreated'
        '400':
          oneOf:
            - $ref: '#/components/responses/BadRequest'
            - $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
  /v1/events:
    post:
      tags: [occurrences]
      operationId: occurrence.create
      x-status: implemented
      x-required-role: [producer]
      summary: Admit one canonical event.
      description: |
        `kind` is a closed vocabulary and severity is a closed ladder (`docs/CONTRACTS.md` §4); a word
        outside either is refused with the sentence the crosswalk raised. Identity is
        `(source, source_event_id)`, so this route needs no `Idempotency-Key`: a re-post of the same event
        answers `duplicate` with the original ids, and a re-post that changed contents is refused as
        `conflict` rather than accepted as a second verdict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalEvent'
      responses:
        '200':
          description: The admission outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventIntakeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
  /v1/intake/{source}:
    post:
      tags: [occurrences]
      operationId: occurrence.intake
      x-status: implemented
      x-required-role: [producer]
      summary: Accept one external source envelope and admit what it proves.
      description: |
        The path names the source and must equal the caller's own credential identity, so one producer
        cannot post on another's behalf. An alert with no keepable sample becomes a `coverage` event about
        the intake path and does not open the underlying condition. A resource name that resolves to two
        declarations answers `conflict`, and one that resolves to none lands as the admitted
        `resource_id: null`; the per-event `resource_link` is where that degradation is visible. At most 50
        alerts per envelope, refused whole rather than truncated.
      parameters:
        - name: source
          in: path
          required: true
          description: The source vocabulary this envelope is in (`alertmanager`, `crowdsec`). Must equal the credential identity.
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceEnvelope'
      responses:
        '200':
          description: One entry per event admitted, with its link verdict.
          headers:
            X-Idempotency-Replayed:
              $ref: '#/components/headers/XIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeBatchResult'
        '400':
          oneOf:
            - $ref: '#/components/responses/BadRequest'
            - $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          oneOf:
            - $ref: '#/components/responses/Conflict'
            - $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
  /v1/actions:
    post:
      tags: [actions]
      operationId: action.propose
      x-status: implemented
      x-required-role: [proposer, human]
      summary: File one approval request against an open incident.
      description: |
        Records a pending proposal and nothing else: no approval, no dispatch, no execution. The request is
        bound to the requester identity from the credential, the action allowlist, canonical parameters and
        its hash. Deduplication is durable — `(requester, retry_key)` — which is why this route is not on
        the `Idempotency-Key` list: one write would otherwise have two answers to "which name identifies
        this proposal?".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: The filed action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
  /v1/actions/decision:
    post:
      tags: [actions]
      operationId: action.decide
      x-status: implemented
      x-required-role: [human]
      summary: Approve or deny a pending action.
      description: |
        The only role that may decide. When a trusted runner handoff is configured, the decision also
        carries the runner binding hash and is captured in the same transaction as the verdict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionDecision'
      responses:
        '200':
          description: The new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
  /v1/actions/review:
    get:
      tags: [actions]
      operationId: action.review
      x-status: implemented
      x-required-role: [human]
      summary: Read the exact request a pending action binds, before deciding it.
      description: |
        One named query parameter, no other spelling accepted. The answer is the stored request plus its
        digest, so a human reviews the bytes the executor will run rather than a description of them.
      parameters:
        - name: action_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The reviewable request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/actions/claim:
    post:
      tags: [actions]
      operationId: action.claim
      x-status: implemented
      x-required-role: [executor]
      summary: Claim an approved action atomically before dispatch.
      description: |
        Returns the execution id and the runner token; a second claim of the same action is refused. Send
        `Idempotency-Key` when the answer matters twice: a runner that lost its response reads back the
        token it was already given instead of losing track of a live execution. Refused with `conflict`
        when a handoff queue is configured, because claiming around the queue skips its binding check.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionIdentifier'
      responses:
        '200':
          description: The claim.
          headers:
            X-Idempotency-Replayed:
              $ref: '#/components/headers/XIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionClaim'
        '400':
          oneOf:
            - $ref: '#/components/responses/BadRequest'
            - $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '409':
          oneOf:
            - $ref: '#/components/responses/Conflict'
            - $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
  /v1/actions/execute:
    post:
      tags: [actions]
      operationId: action.execute
      x-status: implemented
      x-required-role: [executor]
      summary: Request durable handoff of an approved action to a configured runner.
      description: |
        Refuses when no trusted runner is configured. No credential is returned here; the runner holds its
        own. Bodies on this route are parsed strictly — duplicate keys are refused, not last-wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionIdentifier'
      responses:
        '200':
          description: The queued handoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
  /v1/runner/claim:
    post:
      tags: [actions]
      operationId: action.runner.claim
      x-status: implemented
      x-required-role: [executor]
      summary: Claim a queued runner request under a binding the operator configured.
      description: |
        A retried claim with the runner's own journaled token returns that token; a different token is a
        refusal, not a second execution.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerClaim'
      responses:
        '200':
          description: The runner's execution handle.
          headers:
            X-Idempotency-Replayed:
              $ref: '#/components/headers/XIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionClaim'
        '400':
          oneOf:
            - $ref: '#/components/responses/BadRequest'
            - $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '409':
          oneOf:
            - $ref: '#/components/responses/Conflict'
            - $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
  /v1/runner/requests:
    get:
      tags: [actions]
      operationId: action.runner_requests.list
      x-status: implemented
      x-required-role: [executor]
      summary: The queue a named trusted runner may work.
      description: Served only when a runner handoff is configured; the caller's identity must be a configured runner.
      responses:
        '200':
          description: Up to 20 queued requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerQueue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/executions/outcome:
    post:
      tags: [actions]
      operationId: action.execution.outcome
      x-status: implemented
      x-required-role: [executor, human]
      summary: Record what an execution did — succeeded, failed or unknown.
      description: |
        `unknown` is a real outcome and requires reconciliation; a process exit code alone never settles an
        incident. Send `Idempotency-Key` when a lost acknowledgement would otherwise leave the outcome
        ambiguous.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionOutcome'
      responses:
        '200':
          description: The recorded outcome.
          headers:
            X-Idempotency-Replayed:
              $ref: '#/components/headers/XIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
