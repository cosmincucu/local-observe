  /v1/maintenance-intervals:
    get:
      tags: [maintenance]
      operationId: maintenance.interval.read
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: What was quiet over a span, or what one instant was — including for facts that arrive late.
      description: |
        Two questions in one route, chosen by the parameters you send, because they are the same read over
        the same rows.

        * **A span** — `resource`/`service`/`rule` with `from` and `to` (at most 92 days; a bare date names
          a UTC day). Each window reports two spans, and they are not the same claim: `raw` is what a human
          signed and never moves; `adjusted` is what the platform actually held quiet, truncated at a
          revocation and absent for a window this build refuses to apply. `effective` merges the adjusted
          spans into the quiet intervals a report should show, and `outcomes` names each window's outcome.
        * **An instant** — the same scope with `at`, optionally with `class`. `classification` is `planned`,
          `outside` or `unknown`, and it is computed at the *instant you asked about*, not at now: this is
          how a boot report about 15:30 that arrives at 17:30 reaches the window that planned it, long after
          `live_windows` stopped seeing that row.

        `unknown` is a bound, never a default. When the historical search hits `max_rows` the answer says
        `bound_exceeded` and refuses to claim absence; a span read sets `complete: false`. Asking with both
        `at` and `from`/`to`, with two scopes, with a repeated or unknown parameter, or with `class` but no
        `at`, is refused rather than guessed at.
      parameters:
        - name: resource
          in: query
          required: false
          description: A resource uuid. Exactly one of `resource`, `service`, `rule`.
          schema:
            type: string
            format: uuid
        - name: service
          in: query
          required: false
          description: A service uuid, expanded against the built inventory index.
          schema:
            type: string
            format: uuid
        - name: rule
          in: query
          required: false
          description: A rule label, matched on the rule a finding reported.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Span start (inclusive). A bare `YYYY-MM-DD` is that day's start in UTC.
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Span end (exclusive). A bare `YYYY-MM-DD` is the *next* day's start in UTC.
          schema:
            type: string
        - name: at
          in: query
          required: false
          description: One instant to classify, in place of a span.
          schema:
            type: string
        - name: class
          in: query
          required: false
          description: Ask the sharper question — does the planned work explain *this* class of finding?
          schema:
            type: string
            enum: [availability, restart, silence, freshness, backup-integrity, security, application, unclassified]
        - name: limit
          in: query
          required: false
          description: Windows to return for a span read, refused rather than clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: The span's intervals, or the instant's classification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceIntervalAnswer'
        '400':
          oneOf:
            - $ref: '#/components/responses/BadRequest'
            - $ref: '#/components/responses/ContractError'
        '403':
          oneOf:
            - $ref: '#/components/responses/SummaryOnly'
            - $ref: '#/components/responses/ContractError'
  /v1/resources:
    get:
      tags: [resources]
      operationId: resource.read
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: One bounded, filtered page of declared resources, with the declaration behind it named.
      description: |
        The built index seen from a URL, ordered by (name, id), each row carrying its aliases and how many
        relations leave it. `/v1/inventory` stays what it always was (100 rows, display labels, no paging)
        because installed callers assert that shape; this route is the bounded, filterable one, and it ships
        `declaration_revision`, `declaration_sha256` and `built_at` in `provenance` so a caller can say which
        declaration its answer came from.

        `limit` is refused rather than clamped, and the cursor carries the first twelve characters of the
        index's declaration digest beside its offset: a cursor issued against an index this build no longer
        serves is `400 invalid_pagination`, not a page, because continuing a walk across a rebuilt index
        would silently skip or repeat rows. With no index mounted the answer is a `200` whose `status` is
        `unavailable` and whose `complete` is false — the route exists, the artifact does not, and
        `GET /v1/capabilities` says so before a caller has to discover it.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: kind
          in: query
          required: false
          description: One inventory kind. An unknown kind returns no rows and says a filter was applied.
          schema:
            type: string
            enum: [host, device, service, storage, endpoint, backup-job, credential-reference]
        - name: name
          in: query
          required: false
          description: Exact resource name. There is no substring filter, so a partial answer cannot read as a population.
          schema:
            type: string
      responses:
        '200':
          description: The page, its bounds, and the declaration behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclaredResourcePage'
        '400':
          $ref: '#/components/responses/ContractError'
        '403':
          oneOf:
            - $ref: '#/components/responses/SummaryOnly'
            - $ref: '#/components/responses/ContractError'
  /v1/resources/resolve:
    get:
      tags: [resources]
      operationId: resource.alias.resolve
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: Which declared resource one alias or identifier names, including when nothing answers it.
      description: |
        `index.resolve`'s verdicts, shipped as it wrote them: `resolved`, `unknown` and `unknown_uuid`. A name
        that resolves to nothing is an answer rather than a 404 — "this hostname is undeclared" is the fact a
        caller came for, and §3 keeps an alias collision visible rather than tie-broken.

        **`conflict` cannot come out of this read, and why.** The declarations are built with an alias table
        keyed on `(scope, type, value)` and `validation.declared` refuses a colliding normalised alias before
        a row is written, so one alias statement names at most one resource: the collision is killed at the
        build. The verdict that needs *several* aliases at once — an observation carrying a hostname and a
        service name that belong to two resources — is the drift read's, and it reports those two resources
        side by side under `identity_unresolved` rather than choosing one.

        `alias_type` is the closed vocabulary of the inventory schema; anything else is refused rather than
        looked up, because a lookup that accepted a misspelling would answer "no such resource" about a typo.
      parameters:
        - name: id
          in: query
          required: false
          description: A declared resource UUID. Mutually exclusive with the alias pair.
          schema:
            type: string
            format: uuid
        - name: alias_type
          in: query
          required: false
          schema:
            type: string
            enum: [hostname, host.id, ip, legacy_id, service.name]
        - name: alias_value
          in: query
          required: false
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: The alias scope, empty when the declaration left it unset.
          schema:
            type: string
      responses:
        '200':
          description: The resolution, with the declared record when exactly one answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclaredResourceMatch'
        '400':
          $ref: '#/components/responses/ContractError'
        '403':
          oneOf:
            - $ref: '#/components/responses/SummaryOnly'
            - $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/resources/{id}/dependents:
    get:
      tags: [resources]
      operationId: resource.dependents.read
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: What transitively depends on one declared resource, and whether the walk was cut off.
      description: |
        The recursive read `lo-inventory dependents` runs (`index.dependents`), over `runs-on` and
        `depends-on` only, and `relation_types` says so in the answer: "nothing depends on this" and "that
        relation is not followed here" are different claims. `truncated` is the query's own flag — the search
        stopped at the bound — and cycles are deduplicated by the walk rather than recursed into.

        An identifier that is not canonical and an identifier the index never declared answer the same `404`,
        so this route cannot be used to learn which identifier shapes this build accepts.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: limit
          in: query
          required: false
          description: Dependents to return. The query's own ceiling is 1 000; this surface refuses above 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: The dependents, the bound, and the declaration behind them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentPage'
        '403':
          oneOf:
            - $ref: '#/components/responses/SummaryOnly'
            - $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/resource-declarations/validation:
    post:
      tags: [resources]
      operationId: resource.declaration.validate
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: Ask whether a draft declaration would build an index. Nothing is written and nothing is built.
      description: |
        `validation.declared` is the function `lo-inventory build` runs before it writes a file, so `valid`
        here means the builder will accept the document rather than merely that a second, laxer check did.
        `declaration_sha256` is the digest of the **normalised** document — the value a built index records and
        a later drift report cites — so two drafts differing only in key order agree, and a reviewer can pin
        one by digest.

        **An invalid draft is a `200`.** The caller asked a question and this route answered it; the verdict is
        in `status` and the validator's own sentence in `reason`. A `400` stays reserved for a request that
        never asked a valid question (no `declaration`, a `declaration` that is not an object, a body naming an
        actor). The check is a `POST` because it carries a document, not because it writes one: `recorded` is
        always false, and no key of the body is ever a path.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclarationCheckRequest'
      responses:
        '200':
          description: The verdict — `valid` or `invalid`, with the reason for the second.
          headers:
            X-Idempotency-Replayed:
              $ref: '#/components/headers/XIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationCheck'
        '400':
          oneOf:
            - $ref: '#/components/responses/BadRequest'
            - $ref: '#/components/responses/ContractError'
        '403':
          oneOf:
            - $ref: '#/components/responses/SummaryOnly'
            - $ref: '#/components/responses/ContractError'
        '409':
          oneOf:
            - $ref: '#/components/responses/IdempotencyConflict'
            - $ref: '#/components/responses/RequestInProgress'
  /v1/observed-snapshots:
    get:
      tags: [resources]
      operationId: resource.observation.history.read
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: The newest snapshots one source reported, as summaries rather than whole observation sets.
      description: |
        `discovery.history` over a credential. Each row is a summary — status, completeness, instant, how much
        scope and how many observations it carries — because a stored snapshot may hold 10 000 observations and
        "how fresh is the observed plane?" must not be an expensive question. A failed read keeps its
        `error_code`, which is how an absent sensor stays distinguishable from a quiet one (§3).

        There is no cursor: `history` reads the newest N and has nowhere to continue from, so a page exactly as
        wide as the bound reports `truncated: true` and `complete: false` instead of implying the history ended
        there. The bound is 20 rows — a limit on what one request may cost, not on what the store holds.
      parameters:
        - name: source
          in: query
          required: true
          description: The discovery source whose snapshots to read, as a bounded label.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Snapshots to return. Refused rather than clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: The summaries, and what the read could not claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservedSnapshotPage'
        '400':
          $ref: '#/components/responses/ContractError'
        '403':
          oneOf:
            - $ref: '#/components/responses/SummaryOnly'
            - $ref: '#/components/responses/ContractError'
    post:
      tags: [resources]
      operationId: resource.observation.record
      x-status: implemented
      x-required-role: [producer]
      summary: Record one discovery snapshot in the observed plane. Declarations are never edited.
      description: |
        `discovery.ingest`, which is what `lo-inventory observe` calls: the document is validated before the
        database is opened, the row is keyed on `(source, snapshot_id)` with its payload digest, and a replay
        of identical contents answers `duplicate` rather than refusing — the same promise `Store.intake` makes
        about `source_event_id`. A replay under the same id with *different* contents is refused, because two
        claims about one instant cannot both be the record.

        **The source is the credential.** `source` must equal the authenticated identity, exactly as
        `/v1/intake/<source>` requires its path to name its caller: an observed row is the evidence half of a
        later drift finding, and a token able to file another source's observations would make "which prober
        saw this?" a claim about a payload field. With no observed dataset mounted the write is a `503`, not a
        `200` — a success that recorded nothing is the exact lie this route exists to avoid.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservedSnapshotIngest'
      responses:
        '200':
          description: Recorded, or `duplicate` for the identical snapshot already stored.
          headers:
            X-Idempotency-Replayed:
              $ref: '#/components/headers/XIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservedSnapshotRecord'
        '400':
          oneOf:
            - $ref: '#/components/responses/BadRequest'
            - $ref: '#/components/responses/ContractError'
        '403':
          oneOf:
            - $ref: '#/components/responses/SummaryOnly'
            - $ref: '#/components/responses/ContractError'
        '409':
          oneOf:
            - $ref: '#/components/responses/IdempotencyConflict'
            - $ref: '#/components/responses/RequestInProgress'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/observed-snapshots/drift:
    get:
      tags: [resources]
      operationId: resource.drift.evaluate
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: Declared against observed, source by source, with each source's coverage beside its findings.
      description: |
        `discovery.drift` — the comparison `lo-inventory drift` prints — plus the one claim the module does not
        make for itself: whether the answer as a whole is a population. Each named source is graded in
        `sources` (`whole`, or the finding kind that meant it was never judged: `source_unavailable`,
        `source_stale`, `coverage_incomplete`), and `complete` is true only when every source was judged. An
        empty `rows` list from a source that never reported is therefore never printable as "no drift".

        Desired and observed stay separate inside each finding: a `changed` finding carries the declared and the
        observed attribute values, `undeclared` and `identity_unresolved` carry the resolution that failed, and
        a `missing` finding is emitted only by a source that claimed completeness. Up to 8 sources per read.
      parameters:
        - name: source
          in: query
          required: true
          description: One source to judge. Repeat the parameter for up to 8.
          schema:
            type: string
        - name: max_age_seconds
          in: query
          required: false
          description: How old a snapshot may be and still count as current.
          schema:
            type: integer
            minimum: 1
            maximum: 604800
            default: 3600
      responses:
        '200':
          description: The findings, the per-source coverage, and the declaration they were judged against.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftReport'
        '400':
          $ref: '#/components/responses/ContractError'
        '403':
          oneOf:
            - $ref: '#/components/responses/SummaryOnly'
            - $ref: '#/components/responses/ContractError'
  /v1/resource-proposals:
