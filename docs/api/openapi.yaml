      x-status: implemented
      x-required-role: [human]
      summary: Make a new version of a plan effective, leaving windows already running exactly as they were.
      description: |
        The transport's only `PATCH`, and the verb is what makes the meaning readable: an edit appends a
        version to the plan the caller named, where a `POST` to the collection would mint a second plan and
        `POST .../revisions` would leave the caller to guess which id the new version got.

        `expected_version` is required and is optimistic concurrency, not a formality: if the plan moved
        since the caller read it, nothing is written and the answer is `412`. An edit revokes the plan's
        *unstarted* windows from earlier versions and leaves any window already running alone — cutting
        short a silence an operator is standing inside is not what "the recurrence changed" means — and the
        version list keeps every earlier document readable.
      parameters:
