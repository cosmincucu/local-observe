          type: integer
        durable:
          description: >-
            Always false here: a preview files nothing.
          type: boolean
        events:
          type: array
          items:
              $ref: '#/components/schemas/EventPreview'
        family:
          type: string
        judged:
          description: >-
            True when the rule reached a verdict on the input, false when it declined to judge.
          type: boolean
        not_performed:
          description: >-
            What a real producer round would have done and this call deliberately did not.
          type: array
          items:
              type: string
        note:
          type: string
        rule:
          type: object
          properties:
            horizon_seconds:
              type: integer
            id:
              type: string
            kind:
              type: string
            mode:
              type: string
            model:
              type: string
            resource_id:
              type: string
              format: uuid
            severity:
              type: string
            source:
              type: string
            version:
              anyOf:
              -
                type: string
              -
                type: "null"
            watch_rule:
              type: string
          required: [id, kind, mode, resource_id, version]
          additionalProperties: false
        schema_version:
          type: integer
        truncated:
          description: >-
            True only when a stated bound cut rows off this answer.
          type: boolean
      required: [actor, complete, count, durable, events, family, judged, not_performed, rule, schema_version, truncated]
      additionalProperties: false
    SignalEnvelope:
      description: >-
        The store's answer verbatim: query type, parameters, window, rows, the row cap that applied,
        whether the cap bit, and `error` when the store refused. This module adds no rows and drops
        none.
      type: object
      properties:
        error:
          anyOf:
          -
            type: string
          -
            type: "null"
        parameters:
          type: object
          properties:
            resource_id:
              type: string
              format: uuid
            rule_id:
              type: string
          required: [resource_id, rule_id]
          additionalProperties: false
        query_type:
          type: string
        row_limit:
          type: integer
        rows:
          type: array
          items:
              $ref: '#/components/schemas/SignalRow'
        source:
          type: string
        truncated:
          description: >-
            True only when a stated bound cut rows off this answer.
          type: boolean
        window:
          type: object
          properties:
            end:
              type: string
              format: date-time
            start:
              type: string
              format: date-time
          required: [end, start]
          additionalProperties: false
      required: [parameters, query_type, row_limit, rows, source, truncated, window]
      additionalProperties: false
    SignalRead:
      description: >-
        One bounded read of the telemetry store, in the store's own envelope. `complete: false` means
        the store answered with an error, not that nothing was found: an empty window is a whole answer.
      type: object
      properties:
        complete:
          description: >-
            False whenever anything was withheld — an unmounted artifact, a store error, a bound hit.
          type: boolean
        provenance:
          $ref: '#/components/schemas/StoreProvenance'
        result:
          $ref: '#/components/schemas/SignalEnvelope'
        schema_version:
          type: integer
        signal:
          type: string
        window_source:
          type: string
      required: [complete, provenance, result, schema_version, signal, window_source]
      additionalProperties: false
    SignalRow:
      description: >-
        One sample. The keys depend on the signal kind — a metric sample carries `observed_at` and
        `value`, a log line carries its fields, a span carries its service and duration.
      type: object
      properties:
        observed_at:
          type: string
          format: date-time
        value:
          type: number
      required: [observed_at, value]
      additionalProperties: false
    SnapshotSummary:
      description: >-
        One stored snapshot as a count and a verdict, never its payload: a page of history that shipped
        every observation would be unbounded and would re-transmit secrets-adjacent attributes.
      type: object
      properties:
        complete:
          description: >-
            False whenever anything was withheld — an unmounted artifact, a store error, a bound hit.
          type: boolean
        error_code:
          type: "null"
        observations:
          type: integer
        observed_at:
          type: string
          format: date-time
        scope:
          description: >-
            What the answer does and does not authorise.
          type: integer
        snapshot_id:
          type: string
        source:
          type: string
        status:
          description: >-
            Reads: `ok` or `unavailable`. Writes/previews: the domain function's own verdict.
          type: string
      required: [complete, error_code, observations, observed_at, scope, snapshot_id, source, status]
      additionalProperties: false
    StoreProvenance:
      description: >-
        What was asked of the telemetry store: the query type, the bounded parameters, the window
        actually read, and the credential-derived source. Nothing here is a SQL statement — the query
        types are this platform's own closed list.
      type: object
      properties:
        parameters:
          type: object
          properties:
            resource_id:
              type: string
              format: uuid
            rule_id:
              type: string
          required: [resource_id, rule_id]
          additionalProperties: false
        query_type:
          type: string
        read_at:
          type: string
          format: date-time
        source:
          type: string
        window:
          type: object
          properties:
            end:
              type: string
              format: date-time
            start:
              type: string
              format: date-time
          required: [end, start]
          additionalProperties: false
      required: [parameters, query_type, read_at, source, window]
      additionalProperties: false
    TopologyNode:
      description: >-
        One resource in the walk, with the relation that reached it and the depth at which it sat.
      type: object
      properties:
        declaration_revision:
          type: string
        depth:
          type: integer
        kind:
          type: string
        name:
          type: string
        relation:
          type: string
        resource_id:
          type: string
          format: uuid
        via:
          type: string
      required: [declaration_revision, depth, kind, name, relation, resource_id, via]
      additionalProperties: false
    TopologyRead:
      description: >-
        The declared dependency graph around one resource. The observed plane is stated as absent rather
        than silently mixed into the walk.
      type: object
      properties:
        complete:
          description: >-
            False whenever anything was withheld — an unmounted artifact, a store error, a bound hit.
          type: boolean
        direction:
          type: string
        limit:
          type: "null"
        observed_plane:
          type: string
        plane:
          description: >-
            Which plane the answer describes: `declared`, `observed`, or `declared+observed` for a join.
          type: string
        provenance:
          $ref: '#/components/schemas/ReadProvenance'
        reason:
          description: >-
            Present with `status: unavailable`: what is missing and which mount variable names it.
          type: string
        requested_by:
          type: object
          properties:
            identity:
              type: string
            role:
              type: string
          required: [identity, role]
          additionalProperties: false
        result:
          $ref: '#/components/schemas/TopologyWalk'
        returned:
          type: integer
        rows:
          type: array
          items:
              type: object
        schema_version:
          type: integer
        status:
          description: >-
            Reads: `ok` or `unavailable`. Writes/previews: the domain function's own verdict.
          type: string
        truncated:
          description: >-
            True only when a stated bound cut rows off this answer.
          type: boolean
      required: [complete, direction, plane, provenance, result, schema_version]
      additionalProperties: false
    TopologyWalk:
      description: >-
        One graph walk: where it started, how deep it went, the bound it was given, and what — if
        anything — hit that bound. `truncated_by` is the empty list when the walk finished whole.
      anyOf:
      -
        type: object
        properties:
          depth_limit:
            type: integer
          depth_reached:
            type: integer
          direction:
            type: string
          nodes:
            type: array
            items:
                $ref: '#/components/schemas/TopologyNode'
          origin_name:
            type: string
          plane:
            description: >-
              Which plane the answer describes: `declared`, `observed`, or `declared+observed` for a join.
            type: string
          resource_id:
            type: string
            format: uuid
          revision:
            type: object
            properties:
              built_at:
                type: string
                format: date-time
              declaration_revision:
                type: string
              declaration_sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
              schema_version:
                type: string
            required: [built_at, declaration_revision, declaration_sha256, schema_version]
            additionalProperties: false
          truncated:
            description: >-
              True only when a stated bound cut rows off this answer.
            type: boolean
          truncated_by:
            type: array
            items:
                type: object
        required: [depth_limit, depth_reached, direction, nodes, origin_name, plane, resource_id, revision, truncated, truncated_by]
        additionalProperties: false
      -
        type: "null"
    Window:
      description: >-
        The evidence window a judgement was made over, in UTC.
      type: object
      properties:
        end:
          type: string
          format: date-time
        start:
          type: string
          format: date-time
      required: [end, start]
      additionalProperties: false
    DeclarationCheckRequest:
      type: object
      description: |
        One draft declaration, sent whole. `declaration` is the only key a check accepts: a body that names a
        path, a directory, an output file or an actor is refused rather than ignored, because a silently
        dropped field is how a contract dies quietly. `source`/`requested_by` are refused further upstream by
        the transport's own actor-claim check.
      properties:
        declaration:
          type: object
          description: A draft resource declaration, judged by the inventory validator the builder runs.
      required: [declaration]
      additionalProperties: false
    ObservedSnapshotIngest:
      type: object
      description: |
        A `local-observe.observed/v1` snapshot document in the shape `inventory.observed` defines — an open
        object here rather than a second copy of that key list, so this document cannot drift from the schema
        `validation.observed` actually applies. `source` must equal the authenticated identity exactly: a body
        naming another prober is refused with `not_authorised`, and the reason is that an observed row is the
        evidence half of a later drift finding.
      properties:
        schema_version:
          type: integer
          const: 1
        source:
          type: string
        snapshot_id:
          type: string
          format: uuid
        observed_at:
          type: string
        status:
          type: string
          enum: [ok, failed]
        complete:
          type: boolean
        observations:
          type: array
          items:
            type: object
      required: [schema_version, source, snapshot_id, observed_at, status, complete]
    ProposalDraftRequest:
      type: object
      description: |
        The observation to propose and, optionally, how stale its snapshot may be. There is no `path`,
        `directory`, `repository` or `kind` key: the kind comes from the stored observation, the location is
        derived from the mounted proposal directory and the digest of `(source, observation_id)`, so retries
        land on one file and a body cannot name a destination.
      properties:
        source:
          type: string
          description: The discovery source whose newest snapshot is being proposed from.
        observation_id:
          type: string
          description: The observation the declarations do not claim.
        max_age_seconds:
          type: integer
          minimum: 1
          maximum: 604800
          default: 3600
      required: [source, observation_id]
      additionalProperties: false
    RuleValidationRequest:
      type: object
      description: |
        One draft rule and the family that owns it. `family` selects the builder that judges the document, so
        a rule is validated by the code that will run it and not by a second schema free to disagree.
        `pathcheck` and Sigma are deliberately absent from the enumeration: the first's configuration is a
        file its own worker reads, the second belongs to the pinned compiler tier, and half-parsing either
        here would be a laxer validator than the one that matters.
      properties:
        family:
          type: string
          enum: [detection, sustained, slo, forecast, config_drift]
        document:
          type: object
          description: The draft rule document, built by that family's own builder.
      required: [family, document]
      additionalProperties: false
    DetectionEvaluationRequest:
      type: object
      description: |
        The rule, the one sample to judge, and the window the verdict would carry. `sample` is the observation
        record a prober reported (`observed_value`, `observed_at`, optional `unit`); **absent is not an
        error**, it is the coverage case — a rule with no input reports that its input is absent rather than
        going quiet.
      properties:
        rule:
          type: object
        sample:
          type: [object, 'null']
        window_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 60
      required: [rule]
      additionalProperties: false
    SustainedEvaluationRequest:
      type: object
      description: |
        The rule document and the series to judge it against. `points` are `[epoch_seconds, value]` pairs in
        any order — the module sorts and bounds them through `conditions.ordered_points`, the same function a
        real tick judges by, so the ceiling is one rule and not two.
      properties:
        document:
          type: object
        points:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 2
            maxItems: 2
      required: [document, points]
      additionalProperties: false
    SloEvaluationRequest:
      type: object
      description: |
        One objective and the good/bad samples inside its window. `objective` is the entry as the objectives
        document carries it; the producer identity the events would carry is **this credential's**, not a body
        field, which is why this door answers a `producer` and no other role.
      properties:
        objective:
          type: object
        points:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 2
            maxItems: 2
      required: [objective, points]
      additionalProperties: false
    ForecastEvaluationRequest:
      type: object
      description: |
        One predictive rule and the series to fit. The inner threshold rule is `conditions.rule`'s, so every
        bound, the identity and the loudness are checked the way a breach rule checks them; the `predict`
        block adds the fit and its horizon, and both are echoed back in `rule`.
      properties:
        document:
          type: object
        points:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 2
            maxItems: 2
      required: [document, points]
      additionalProperties: false
    ConfigDriftComparisonRequest:
      type: object
      description: |
        The artifact's identity (`entry`: its resource, name, rule and labels — the same key the producer
        derives) and both texts, each as `{text}` or `{sha256, text}`. **A supplied `sha256` is ignored and
        the digest is derived from the bytes**: a caller able to name both could assert a digest the text does
        not have, and the whole value of a drift finding is that its digest is what the bytes are.
      properties:
        entry:
          type: object
        previous:
          type: object
          properties:
            text:
              type: string
          required: [text]
        current:
          type: object
          properties:
            text:
              type: string
          required: [text]
        window_seconds:
          type: integer
          minimum: 1
          maximum: 86400
      required: [entry, current]
      additionalProperties: false
    PathCheckEvaluationRequest:
      type: object
      description: |
        `observations` are probe records the caller already holds (`target`, `ok`, optional
        `vantage_resource_id`, `asn`, `protocol`), `expected_vantage_points` and `expected_targets` are the
        grid the configuration is supposed to probe, and `open_finding` is the caller's own statement of what
        it believes is already open. All of it is a supplied fixture: this route takes no probe, reads no
        `LO_PATHCHECK_CONFIG` and moves no cursor — which is why an answer says "given these probes" and never
        "here is what the grid saw".
      properties:
        observations:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              target:
                type: string
              ok:
                type: boolean
              vantage_resource_id:
                type: string
                format: uuid
              asn:
                type: [string, 'null']
              protocol:
                type: string
            required: [target, ok]
        vantage_resource_id:
          type: string
          format: uuid
          description: The vantage the round speaks from, and the resource the event would name.
        expected_vantage_points:
          type: array
          items:
            type: string
            format: uuid
        expected_targets:
          type: array
          items:
            type: string
        open_finding:
          type: [object, 'null']
        window_seconds:
          type: integer
          minimum: 1
          maximum: 86400
      required: [observations, vantage_resource_id]
      additionalProperties: false
    DeploymentLockRequest:
      type: object
      description: |
        The packages to lock, sent whole: this route fetches nothing, so `content_ref`s must arrive as the
        caller's own records — an identifier inside one reserved namespace, never a URL to fetch. A package set
        wider than the transport's 64 KiB body bound is locked by `lo-deployment lock`, which can read a
        checkout.
      properties:
        packages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
      required: [packages]
      additionalProperties: false
    DeploymentPlanRequest:
      type: object
      description: |
        Three documents the caller owns — what was deployed before, what is there now, what is proposed. The
        module compares them and never discovers them, which is why this body carries documents rather than
        hosts, identifiers or connection strings.
      properties:
        previous:
          type: object
        observed:
          type: object
        candidate:
          type: object
      required: [previous, observed, candidate]
      additionalProperties: false
    DeploymentRenderingRequest:
      type: object
      description: |
        The desired packages, the reviewed lock they must match pin for pin, and the deployment document that
        says what they are for. Overrides and runtime values are the caller's own files in the caller's own
        tree: this route reads nothing from disk and writes nothing to it, so it cannot resolve one
        installation's secrets while answering for another.
      properties:
        packages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
        lock:
          type: object
        deployment:
          type: object
      required: [packages, lock, deployment]
      additionalProperties: false
    DashboardExportRequest:
      type: object
      description: |
        A resolved state (the output of a rendering), the content identifier to project, and the caller's own
        document for it. No endpoint, token or container name appears anywhere in this body: the verbs that
        would need one are the three declined siblings, and `GET /v1/capabilities` says which and why.
      properties:
        state:
          type: object
        id:
          type: string
          description: The content identifier inside the resolved state, in its package's own namespace.
        document:
          type: object
      required: [state, id, document]
      additionalProperties: false
