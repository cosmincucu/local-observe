          oneOf:
            - $ref: '#/components/responses/IdempotencyConflict'
            - $ref: '#/components/responses/RequestInProgress'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        One opaque token from the mounted role file (`LO_PLATFORM_CREDENTIALS`), compared with
        `secrets.compare_digest`. Exactly one `Authorization` header is accepted: two values are refused
        rather than resolved by ordering, so a proxy cannot choose which credential a request used. A
        token is never accepted from a query string, a cookie or a body field, and the retired
        `LO_PLATFORM_CREDENTIALS_JSON` environment form is a startup refusal, not a fallback.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: |
        A declared resource UUID. A non-canonical identifier and an identifier the index never declared are
        refused the same way on `/v1/resources/{id}/dependents`, so no path through this surface reports
        which identifiers exist.
      schema:
        type: string
        format: uuid
    ProposalId:
      name: id
      in: path
      required: true
      description: |
        The proposal identifier — a SHA-256 digest its own content produced. It is validated as a digest
        before any path is built, so a caller may name a draft and never a location.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Run this write once, and let me read the same answer back if I lose it. Bounded to
        `[A-Za-z0-9_.:-]{1,128}` and refused, never normalised, if malformed or repeated. Same key plus the
        same canonical body replays the stored answer with `X-Idempotency-Replayed: true`; same key plus a
        different body is `409 idempotency_conflict` and nothing runs; a key still in flight is
        `409 request_in_progress`, never a wait. Only a 2xx is stored, records expire after 24 hours, and a
        key claimed by a process that died is released to the next caller after 300 seconds.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:-]{1,128}$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The revision this write was read at, as the `ETag` the read issued. A mismatch is
        `412 stale_revision`; `*` means "overwrite whatever is there" and is treated as no expectation.
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      required: false
      description: Rows to return. Refused rather than clamped, so a caller never mistakes a ceiling for completeness.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: An opaque continuation token from a previous page's `next_cursor`. A token this service never issued is refused.
      schema:
        type: string
    OccurrenceId:
      name: id
      in: path
      required: true
      description: |
        The occurrence identifier — the incident id of one episode, a canonical UUID. An id that is not one
        and an id this platform never opened answer the same `404`, so the route cannot be used to probe
        which identifier shapes this build has seen.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    AuditLimit:
      name: limit
      in: query
      required: false
      description: Rows for this page, within the audit reader's own bound.
      schema:
        type: integer
    AuditCategory:
      name: category
      in: query
      required: false
      description: One member of the audit reader's closed category vocabulary, or `all`.
      schema:
        type: string
    AuditSnapshot:
      name: snapshot
      in: query
      required: false
      description: The read mark this page came from; always paired with `before`.
      schema:
        type: integer
    AuditBefore:
      name: before
      in: query
      required: false
      description: Continue below this audit sequence; always paired with `snapshot`.
      schema:
        type: integer
  headers:
    XRequestId:
      description: The identifier this answer and its server-side log line share.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:-]{1,64}$'
    XIdempotencyReplayed:
      description: Set when the answer came out of the idempotency record instead of a second execution.
      schema:
        type: string
        const: 'true'
    ETag:
      description: The revision a subsequent conditional write must send back in `If-Match`.
      schema:
        type: string
  responses:
    Unauthorized:
      description: No credential, two `Authorization` headers, or one this service does not know.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
          example: {"error": "authentication_required"}
    CallbackUnauthorised:
      description: A code that is wrong, unknown, or minted for another channel. One answer for all three.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
          example: {"error": "callback_unauthorised"}
    SummaryOnly:
      description: A read-only summary credential reached a route that is not `/v1/me` or `/v1/overview`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
          example: {"error": "summary_only"}
    BadRequest:
      description: |
        The request was refused by the parser, the shape gate or the platform's own rules. `detail` is one of
        this build's fixed sentences and never a value from the request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
          example: {"error": "invalid_request", "detail": "Expected a JSON object body"}
    NotFound:
      description: No route answers this path, or this installation has not configured the surface it needs.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
          example: {"error": "not_found"}
    MethodNotAllowed:
      description: |
        A verb this route does not carry. The API serves GET and POST everywhere, and `PATCH` on
        `/v1/maintenance-schedules/{id}` and nowhere else.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
          example: {"error": "method_not_allowed"}
    BodyTooLarge:
      description: Refused by the chunk that crossed 64 KiB, before the body was parsed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
          example: {"error": "body_too_large"}
    Conflict:
      description: |
        The request is well formed but collides with state the caller cannot see from here — a spent token,
        an action that is not pending, an event re-posted with different contents.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
          example: {"error": "conflict", "detail": "Action is not pending"}
    ContractError:
      description: |
        A refusal the shared boundary chose, in the machine envelope: one code, one sentence, and the request
        id. Produced only by an opt-in part of the contract, so no client that exists today receives it.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdempotencyConflict:
      description: This `Idempotency-Key` already completed a different request body. Nothing ran.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example: {"error": {"code": "idempotency_conflict", "message": "This Idempotency-Key was already used for a different request body", "request_id": "0f0f0f0f-0000-4000-8000-000000000000"}}
    RequestInProgress:
      description: Another request holds this key right now. Nothing ran, and nothing was queued.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StaleRevision:
      description: The resource changed since the revision this request named. Read it again.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: |
        Nobody chose this exception. The body names only the exception class; the traceback is logged at
        DEBUG and the log line carries this request's id.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
          example: {"error": "internal_error", "detail": "KeyError"}
    VerificationUnavailable:
      description: No verification policy is mounted, so nothing may be attested.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    VerificationBusy:
      description: This process serves one synchronous verification call at a time and the slot is taken. Shed, not queued.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    VerificationStorageError:
      description: This build's storage is failing. One fixed body; no driver text, no path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    ObserverReviewBusy:
      description: The observer review seam serves one journal call at a time and the slot is taken.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    ObserverStateUnavailable:
      description: The observer's private journal could not be read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    OperationUnavailable:
      description: |
        The route exists and this build would answer it, but the artifact it reads is not mounted. The body
        names the environment variable that mounts it, and `GET /v1/capabilities` lists every operation
        sitting in this state. A `503` and never a `404`: the route is here, and the fix is a mount.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    LegacyError:
      type: object
      description: The flat error shape the routes that existed before the shared boundary answer with.
      properties:
        error:
          type: string
          enum: [authentication_required, callback_unauthorised, not_authorised, summary_only,
                 invalid_request, body_too_large, not_found, method_not_allowed, conflict,
                 internal_error, observer_state_unavailable, observer_review_busy, operator_login_busy,
                 verification_unavailable, verification_busy, verification_storage_error]
        detail:
          type: string
      required: [error]
      additionalProperties: false
    ErrorEnvelope:
      type: object
      description: |
        The machine envelope. Three fields and no fourth: a code to switch on, one sentence for a human, and
        the request id that ties it to the server-side log. Never a request value, a path, a token or an
        exception string.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [authentication_required, callback_unauthorised, not_authorised, summary_only,
                     invalid_request, invalid_idempotency_key, actor_claim_refused, invalid_pagination,
                     invalid_revision, body_too_large, not_found, method_not_allowed, conflict,
                     idempotency_conflict, request_in_progress, stale_revision, internal_error,
                     observer_state_unavailable, observer_review_busy, operator_login_busy,
                     verification_unavailable, verification_busy, verification_storage_error,
                     operation_unavailable]
            message:
              type: string
            request_id:
              type: string
              pattern: '^[A-Za-z0-9_.:-]{1,64}$'
          required: [code, message, request_id]
          additionalProperties: false
      required: [error]
      additionalProperties: false
    ActorIdentity:
      type: object
      description: The actor the credential decides, never the actor a body claimed.
      properties:
        identity:
          type: string
        role:
          type: string
          enum: [reader, producer, proposer, human, executor, summary]
      required: [identity, role]
      additionalProperties: false
    StatusCounts:
      type: object
      description: Status to count. An absent key means no row holds that status — not zero, not unknown.
      propertyNames:
        type: string
      additionalProperties:
        type: integer
    PlatformStatus:
      type: object
      properties:
        schema_version:
          type: integer
          description: The operational schema this build reads and writes.
        incidents:
          $ref: '#/components/schemas/StatusCounts'
        actions:
          $ref: '#/components/schemas/StatusCounts'
        notifications:
          $ref: '#/components/schemas/StatusCounts'
      required: [schema_version, incidents, actions, notifications]
    RuntimeSnapshot:
      type: object
      description: |
        A startup filesystem snapshot, the delivery loop's own tally, and the refusal-audit counters — three
        sources, one body. `scope` and `resets_on_restart` name the volatility of the last group; a shed
        refusal is counted and has no row.
      properties:
        schema_version:
          type: integer
        pid:
          type: integer
        observed_at:
          type: string
        code_root:
          type: string
        startup_source_sha256:
          type: string
        source_pin_verified:
          type: boolean
        notification_mode:
          type: string
          enum: ['off', recording, live]
        sender_configured:
          type: boolean
        refusal_audit:
          type: object
        refusal_audit_dispatch:
          type: object
        delivery_loop_failures:
          type: integer
        delivery_loop_last_failure_at:
          type: ['string', 'null']
      required: [schema_version, notification_mode, sender_configured]
      additionalProperties: true
    PortalSummary:
      type: object
      description: Portal summary v1. A missing coverage never implies zero failures or a verified backup.
      properties:
        schema_version:
          type: integer
          const: 1
        generated_at:
          type: string
        open_incidents:
          type: integer
        pending_approvals:
          type: integer
        pending_deliveries:
          type: integer
        dead_deliveries:
          type: integer
        suppressed_deliveries:
          type: ['integer', 'null']
        last_verified_backup:
          type: ['string', 'null']
        failed_jobs:
          type: ['integer', 'null']
        resident_model:
          type: ['string', 'null']
        jobs_status:
          type: string
        jobs_scope:
          type: string
      required: [schema_version, generated_at, open_incidents, pending_approvals, pending_deliveries]
    AuditRow:
      type: object
      properties:
        sequence:
          type: integer
        at:
          type: string
        actor:
          type: string
        operation:
          type: string
        subject:
          type: string
        detail:
          type: object
        omitted:
          type: string
          description: Present instead of `detail` when the per-row width bound cut the stored document.
      required: [sequence]
    AuditPage:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AuditRow'
        snapshot:
          type: integer
          description: The read mark this page and its cursor belong to.
        next_before:
          type: ['integer', 'null']
          description: The position to continue from, or null when this page is the last.
        scanned:
          type: integer
          description: Positions examined to build the page — the cost, stated, so a short page is not a claim of absence.
      required: [rows, snapshot, next_before, scanned]
    RecordWindow:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            description: |
              One stored row, its secret columns (token hashes, claim tokens, callback token hashes) removed
              before the page was built, plus `display` where a projection applies.
      required: [rows]
    InventoryWindow:
      type: object
      properties:
        rows:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              kind:
                type: string
              name:
                type: string
              display:
                type: object
            required: [id, kind, name]
      required: [rows]
    DispositionRequest:
      type: object
      description: |
        The whole body one disposition write may carry. `reason` is required because a decision nobody can
        explain next month is the artifact this feature replaces; `expected_revision` is the body form of the
        conditional write (a caller may send `If-Match` instead). A field naming an identity, a role or a
        credential is refused with `400 actor_claim_refused` before the state layer is reached, and any other
        field is refused rather than ignored.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 400
          description: One printable line, required. No CR, LF or NUL.
        expected_revision:
          type: string
          description: The revision tag this caller read, as the `ETag` the read issued.
      required: [reason]
      additionalProperties: false
    OccurrenceDocument:
      type: object
      description: |
        One alert episode, read three ways at once: what the source measures (`measured`), what a human has
        decided (`disposition`/`state`), and what has been delivered (`delivery`). The three are separate
        fields on purpose — `docs/api/occurrences.md` §1 to §3 is the contract that keeps them apart, and a
        reviewer who merges any two of them builds a pager that either loses a real page or re-pages someone
        who already answered.
      properties:
        occurrence_id:
          type: string
          description: The incident id of the episode — a canonical UUID, and the only name this surface has.
        episode:
          type: object
          description: |
            What this occurrence *is*. `identity_basis` says how the identity was delimited without the reader
            having to guess: `incident` for a continuous condition bounded by its own recovery/re-fire
            boundary, `discrete` for a producer that carries the occurrence identity in `condition` (a boot,
            a session, a run), `verdict-unreadable` for an event row this build could not decode — which
            yields null names rather than invented ones. `members` is the size of the group
            (`platform/correlation.py`) and `rung` whether this episode is an escalation stage of another rule.
          properties:
            identity_basis:
              type: string
              enum: [incident, discrete, verdict-unreadable]
            condition_key:
              type: string
            resource_id:
              type: ['string', 'null']
            members:
              type: integer
            rung:
              type: boolean
            source:
              type: ['string', 'null']
            rule_id:
              type: ['string', 'null']
            rule_version:
              type: ['string', 'null']
            condition:
              type: ['string', 'null']
          required: [identity_basis, condition_key, resource_id, members, rung]
        measured:
          type: object
          description: |
            The source's own answer, which nothing here may write. `condition_status` is the anchor
            condition's latest verdict; a group stays open until its last member clears.
          properties:
            status:
              type: string
              enum: [open, resolved]
            condition_status:
              type: ['string', 'null']
              enum: [firing, resolved, unknown, null]
            opened_at:
              type: string
            updated_at:
              type: string
          required: [status, opened_at, updated_at]
        disposition:
          type: ['object', 'null']
          description: |
            The effective operator statement, or null when nobody has spoken for this episode. Durable
            who/when/why: a repeat of the identical statement does not move `at`, `actor` or `reason`.
          properties:
            kind:
              type: string
              enum: [acknowledged, dismissed]
            actor:
              type: string
              description: The identity in the bearer credential, never a body field.
            reason:
              type: string
            at:
              type: string
            revision:
              type: integer
          required: [kind, actor, reason, at, revision]
        state:
          type: string
          enum: [unacknowledged, acknowledged, dismissed, source-resolved]
          description: |
            Disposition and measurement resolved into one word, derived and never stored. `source-resolved`
            outranks an operator's act, which is why an episode can read `measured.status = resolved` beside
            `state = dismissed` and no stored row can disagree with the verdict that ended it.
        revision:
          type: string
          description: |
            The conditional-write tag: the disposition revision, the measured status and the episode's opening
            instant, each visible and each moving for one reason. Send it back as `If-Match` (or in
            `expected_revision`) to refuse a write over state nobody read.
        delivery:
          type: object
          description: |
            The episode's deliveries rolled up. `in_flight` counts rows on a lease, `dispatched` rows whose
            attempt ended with no acknowledgement obtained, and `uncertain` is true while either is nonzero:
            a disposition never recalls a message, and this is where the uncertainty is stated rather than
            left to be inferred from an absence. `recalled` is false because it is always false here.
          properties:
            queued:
              type: integer
            in_flight:
              type: integer
            dispatched:
              type: integer
            sent:
              type: integer
            suppressed:
              type: integer
            exhausted:
              type: integer
              description: |
                `dead` rows that carry no suppression record — attempts spent, not a human's no.
            recalled:
              type: boolean
              const: false
            uncertain:
              type: boolean
          required: [queued, in_flight, dispatched, sent, suppressed, exhausted, recalled, uncertain]
        projections:
          type: object
          description: |
            The two downstream statements a committed disposition owes, and where each stands. A target with
            no record reads `unconfigured` and a target with one that no sink served reads `pending` with
            `last_error: not-configured` — two different sentences about the world, and the reason neither is
            a silence. A failed projection never undoes the disposition beside it.
          properties:
            telemetry-metric:
              $ref: '#/components/schemas/ProjectionState'
            rule-card:
              $ref: '#/components/schemas/ProjectionState'
          required: [telemetry-metric, rule-card]
          additionalProperties: false
        legacy_evidence:
          type: array
          items:
            type: string
            enum: [action-decided, approval-intent]
          description: |
            What the pre-existing acknowledgement reads saw about this episode, as words and nothing more.
            Neither entry is a disposition: a tapped page link names no human and carries no reason
            (`docs/CONTRACTS.md` §5), so an operator can read "somebody tapped, nobody gave a reason".
        created:
          type: boolean
          description: |
            Present on a write's answer: false for the identical statement restated.
        folded:
          type: integer
          description: |
            Present on a write's answer: deliveries this call moved out of the queue.
      required: [occurrence_id, episode, measured, disposition, state, revision, delivery, projections,
                 legacy_evidence]
    DispositionResult:
      type: object
      description: |
        The occurrence after the write, and the two facts only the write can state: `created` is false for the
        identical statement restated (same kind, same actor, same reason — nothing moved, no history row
        added), and `folded` counts the still-`pending` deliveries this call moved out of the queue. A leased
        or already-sent delivery is in neither number; it is in `delivery.in_flight` and `delivery.uncertain`.
      allOf:
        - $ref: '#/components/schemas/OccurrenceDocument'
        - type: object
          properties:
            created:
              type: boolean
            folded:
              type: integer
          required: [created, folded]
    ProjectionState:
      type: object
      properties:
        status:
          type: string
          enum: [pending, sent, unconfigured]
        attempts:
          type: integer
          description: Failed attempts at *what is pending now*; a re-disposition resets the count.
        available_at:
          type: ['string', 'null']
        last_error:
          type: string
          description: An exception class name or a fixed word (`refused`, `not-configured`). Never a body, a URL or a credential.
      required: [status, attempts, available_at, last_error]
    OccurrencePage:
      type: object
      description: One bounded page of occurrences, oldest episode first.
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/OccurrenceDocument'
        limit:
          type: integer
        returned:
          type: integer
        next_cursor:
          type: string
      required: [rows, limit, returned]
    DispositionHistoryRow:
      type: object
      description: |
        One accepted disposition, append-only. A restatement that changed nothing added no row, so this is a
        record of decisions and not of retries.
      properties:
        sequence:
          type: integer
        kind:
          type: string
          enum: [acknowledged, dismissed]
        actor:
          type: string
        reason:
          type: string
        at:
          type: string
        revision:
          type: integer
      required: [sequence, kind, actor, reason, at, revision]
    DispositionHistoryPage:
      type: object
      description: One bounded page of one episode's dispositions, oldest first.
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DispositionHistoryRow'
        limit:
          type: integer
        returned:
          type: integer
        next_cursor:
          type: string
      required: [rows, limit, returned]
    EvidenceSample:
      type: object
      description: The whole retained context of one observation. Anything wider is refused, not truncated.
      properties:
        sample_id:
          type: string
        observed_at:
          type: string
          format: date-time
        ok:
          type: boolean
        value:
          type: ['boolean', 'number', 'null']
      required: [sample_id, observed_at, ok, value]
      additionalProperties: false
    EvidenceCreated:
      type: object
      properties:
        evidence_id:
          type: string
      required: [evidence_id]
    EvidenceStatus:
      type: object
      oneOf:
        - type: object
          properties:
            status:
              type: string
              const: available
            sample:
              $ref: '#/components/schemas/EvidenceSample'
            expires_at:
              type: string
          required: [status, sample, expires_at]
        - type: object
          properties:
            status:
              type: string
              enum: [expired, unavailable]
          required: [status]
    CanonicalEvent:
      type: object
      description: |
        The closed canonical field set (`docs/CONTRACTS.md` §4). `kind` and `severity` are closed
        vocabularies and a word outside either is refused with the crosswalk's own sentence; a field the
        shape does not list is refused too, so no payload text becomes an operator-visible label.
      properties:
        schema_version:
          type: integer
          const: 1
        source:
          type: string
        source_event_id:
          type: string
        resource_id:
          type: ['string', 'null']
          description: A declared UUID, or an explicit null meaning "unresolved" — the answer, not a refusal.
        observed_at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [availability, coverage, threshold, drift, anomaly, security]
        severity:
          type: string
          enum: [info, warning, critical]
        data_class:
          type: string
        evidence:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
      required: [schema_version, source, source_event_id, resource_id, observed_at, kind, severity]
    SourceEnvelope:
      type: object
      description: |
        One source's own shape — Alertmanager's `{"alerts": [...]}` today, CrowdSec beside it. Envelope-level
        fields and annotations are not read; a payload with nothing keepable becomes a `coverage` event about
        the intake path rather than a verdict about the thing it was watching.
      properties:
        alerts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
      additionalProperties: true
    EventIntakeResult:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, duplicate]
        event_id:
          type: string
          format: uuid
        incident_id:
          type: ['string', 'null']
          format: uuid
        transition:
          type: ['string', 'null']
          description: opened, resolved or null — the change this event made to incident state, not the event's own status.
      required: [status, event_id]
    IntakeBatchResult:
      type: object
      properties:
        source:
          type: string
        events:
          type: array
          maxItems: 50
          items:
            allOf:
              - $ref: '#/components/schemas/EventIntakeResult'
              - type: object
                properties:
                  resource_link:
                    type: string
                    enum: [resolved, unknown, conflict, no_alias, index_unavailable, not_configured]
                    description: Where a name that did not become a UUID is visible. The canonical event must not gain a field for it.
                required: [resource_link]
      required: [source, events]
    ActionRequest:
      type: object
      description: |
        An action a human is being asked to approve. No identity field: the requester is the credential.
        The exact required fields, the action allowlist and the target opt-in are enforced by the state and
        policy layers, and refused with the sentence each one raised.
      properties:
        incident_id:
          type: string
          format: uuid
        retry_key:
          type: string
          description: The caller's durable deduplication name, scoped to this requester.
        action:
          type: string
        version:
          type: string
        targets:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        parameters:
          type: object
        evidence:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        expires_at:
          type: string
          format: date-time
    ActionStatus:
      type: object
      properties:
        action_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, denied, expired, executing, succeeded, failed, unknown]
      required: [action_id, status]
    ActionIdentifier:
      type: object
      properties:
        action_id:
          type: string
          format: uuid
      required: [action_id]
      additionalProperties: false
    ActionDecision:
      type: object
      properties:
        action_id:
          type: string
          format: uuid
        decision:
          type: string
          enum: [approved, denied]
        binding_sha256:
          type: string
          description: Required when a trusted runner handoff is configured.
      required: [action_id, decision]
      additionalProperties: false
    ActionReview:
      type: object
      properties:
        mode:
          type: string
          enum: [manual, runner]
        action_id:
          type: string
          format: uuid
        request:
          type: object
          description: The stored request document, byte-for-byte what an approval binds.
        request_sha256:
          type: string
      required: [mode, action_id, request, request_sha256]
    ActionClaim:
      type: object
      properties:
        execution_id:
          type: string
        runner_token:
          type: string
          description: Shown once, to the credential that earned it. It is stored hashed.
        status:
          type: string
          const: executing
        request:
          type: object
      required: [execution_id, status]
    HandoffQueued:
      type: object
      properties:
        action_id:
          type: string
          format: uuid
        status:
          type: string
        queued:
          type: boolean
      required: [action_id, status, queued]
    RunnerClaim:
      type: object
      properties:
        action_id:
          type: string
          format: uuid
        binding_sha256:
          type: string
        runner_token:
          type: string
          description: The caller's own previously journaled token, which is what makes a retried claim safe.
      required: [action_id, binding_sha256, runner_token]
      additionalProperties: false
    RunnerQueue:
      type: object
      properties:
        requests:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              action_id:
                type: string
              binding_sha256:
                type: string
      required: [requests]
    ExecutionOutcome:
      type: object
      properties:
        execution_id:
          type: string
        outcome:
          type: string
          enum: [succeeded, failed, unknown]
        runner_token:
          type: string
      required: [execution_id, outcome]
      additionalProperties: false
    StatusResult:
      type: object
      properties:
        status:
          type: string
      required: [status]
    DeliveryIdentifier:
      type: object
      properties:
        delivery_id:
          type: string
      required: [delivery_id]
      additionalProperties: false
    ChannelSafety:
      type: object
      properties:
        circuit_open:
          type: boolean
        delivery_mode:
          type: string
          enum: ['off', recording, live]
        max_attempts:
          type: integer
        window_seconds:
          type: integer
      required: [circuit_open, delivery_mode]
    NotificationSafety:
      type: object
      properties:
        channel:
          type: string
        delivery_mode:
          type: string
          enum: ['off', recording, live]
        circuit_open:
          type: boolean
        suppressed:
          type: integer
        synthetic_default:
          type: string
        test_window:
          type: ['string', 'null']
        channels:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChannelSafety'
      required: [channel, delivery_mode, circuit_open, suppressed]
    SafetyReset:
      type: object
      properties:
        status:
          type: string
          const: reset
        backlog_replayed:
          type: boolean
      required: [status, backlog_replayed]
    CallbackToken:
      type: object
      properties:
        token:
          type: string
          description: The single-use code, in the body. Never in a path or a query string.
        action_id:
          type: string
          format: uuid
      required: [token, action_id]
      additionalProperties: false
    ApprovalIntent:
      type: object
      properties:
        status:
          type: string
          const: intent_recorded
        action_id:
          type: string
          format: uuid
        delivery_id:
          type: string
        decided:
          type: boolean
          description: Always false. Receipt of a callback is not an approval and not a completion.
      required: [status, action_id, delivery_id, decided]
    SetupPlan:
      type: object
      properties:
        plan_id:
          type: string
        plan:
          type: object
        status:
          type: string
          enum: [pending, approved, denied, queued, executing, completed, partial, expired]
        preflight:
          type: object
          description: |
            Exactly what the plan checked, and what it did not touch — endpoints not-contacted, secret values
            not-read.
          properties:
            filesystem:
              type: string
            endpoints:
              type: string
            secret_values:
              type: string
            services:
              type: string
          required: [filesystem, endpoints, secret_values, services]
      required: [plan_id, plan, status, preflight]
    SetupStatus:
      type: object
      properties:
        plan_id:
          type: string
        status:
          type: string
      required: [plan_id, status]
    VerificationBinding:
      type: object
      description: |
        The rule revision and captured read that a later submitted observation is judged against. Recorded
        inside the proposal's own transaction, so the verdict is bound to what was seen when the action was
        approved.
      properties:
        binding_sha256:
          type: string
        rule_revision:
          type: string
      required: [binding_sha256, rule_revision]
    VerificationRecord:
      type: object
      description: |
        One submitted observation, parsed strictly (duplicate keys, non-finite numbers and unbounded
        integers are refused) and bounded by `verification_records.MAX_RECORD_BYTES`. The server derives the
        verdict; a stored `cleared` means "consistent with the captured read".
    VerificationSubmitted:
      type: object
      description: |
        The digest the record is stored under, and whether this submission created it. Re-posting the
        identical record answers the same body with `created` false; re-posting it with different contents is
        a `409`. The derived verdict itself is the verification unit's contract
        (`verification_records.py`, docs/units/verification-api.md).
      properties:
        verification_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        created:
          type: boolean
      required: [verification_id, created]
      additionalProperties: false
    ObserverCycleList:
      type: object
      properties:
        schema_version:
          type: integer
          const: 1
        cycles:
          type: array
          items:
            type: object
            description: One cycle summary — status, coverage, whether it is reviewable, and the latest feedback id if any.
        limit:
          type: integer
        returned:
          type: integer
        total_cycles:
          type: integer
        truncated:
          type: boolean
        next_after:
          type: ['string', 'null']
      required: [schema_version, cycles, limit, returned, total_cycles, truncated, next_after]
    ObserverCycleDetail:
      type: object
      description: |
        One cycle with its retained redacted evidence, its corrections newest-last, and the digest the grade
        must name. `feedback_truncated` says the feedback list is a page, not the history.
      properties:
        schema_version:
          type: integer
          const: 1
        cycle_sha256:
          type: string
        reviewable:
          type: boolean
        latest_feedback_id:
          type: ['string', 'null']
        feedback_total:
          type: integer
        feedback_truncated:
          type: boolean
        replay:
          type: ['object', 'null']
      required: [schema_version, cycle_sha256, reviewable, feedback_total, feedback_truncated]
    ObserverFeedbackRequest:
      type: object
      description: |
        One human grade against the named cycle digest. No identity field is read: the reviewer is the
        credential, and a `reader` or `summary` token is refused before the cycle is looked up. The exact
        accepted fields and their bounds belong to `observer_review.py` and its contract in
        docs/units/observer.md.

    # --- maintenance: the declared silence, the plan behind it, and what became of both ---------
    MaintenanceScope:
      type: object
      description: |
        What a window or a plan covers. `resource` is one resource id, `service` is expanded at declaration
        time against the built inventory index (its members are a fact about the estate and are never
        guessed at read time), and `rule` matches the rule label a finding reported, on any resource.
      properties:
        kind:
          type: string
          enum: [resource, service, rule]
        id:
          type: string
          description: A resource or service uuid, or a rule label. Validated by the kind.
      required: [kind, id]
    MaintenanceConditionClass:
      type: string
      description: |
        What kind of finding a window accounts for. `availability`, `restart`, `silence` and `freshness` are
        what planned work does cause and are explained by default; `security`, `backup-integrity`,
        `application` and `unclassified` are not, and page through a window unless the declaration names
        them. A v1 window that named no classes at all is class-blind and covers its whole selector.
      enum: [availability, restart, silence, freshness, backup-integrity, security, application, unclassified]
    MaintenanceWindowRow:
      type: object
      description: |
        One stored window as the delivery path sees it: the selector, the span a human signed, the author,
        the condition classes it explains, and the schedule and occurrence it came from when it did.
        `None` in the schedule fields means an ad-hoc window, not a missing read.
      properties:
        id:
          type: string
          format: uuid
        resource_id:
          type: ['string', 'null']
          format: uuid
        rule_id:
          type: ['string', 'null']
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
        author:
          type: string
        declared_at:
          type: string
          format: date-time
        explains:
          type: ['array', 'null']
          items:
            $ref: '#/components/schemas/MaintenanceConditionClass'
        schedule_id:
          type: ['string', 'null']
          format: uuid
        schedule_version:
          type: ['integer', 'null']
        occurrence_id:
          type: ['string', 'null']
          format: uuid
        revoked_at:
          type: ['string', 'null']
          format: date-time
        revoked_by:
          type: ['string', 'null']
      required: [id, starts_at, ends_at, reason, author, declared_at]
    MaintenanceWindowList:
      type: object
      description: |
        The live windows and the health of the read that produced them. `count` is the rows in `windows`;
        `scanned` is every unrevoked row the read looked at, and `expired`/`revoked`/`unusable`/`unattested`
        say where the rest went. When `bound_exceeded` is true the read stopped at `max_rows` and the list
        is not whole — an absent window is not an un-planned one.
      properties:
        windows:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/MaintenanceWindowRow'
              - type: object
                properties:
                  covers_now:
                    type: boolean
                    description: Whether this window covers the instant of the read, not merely its span.
                required: [covers_now]
        count:
          type: integer
        scanned:
          type: integer
        bound_exceeded:
          type: boolean
        unusable:
          type: integer
        unattested:
          type: integer
        revoked:
          type: integer
        expired:
          type: integer
        max_live_windows:
          type: integer
        max_seconds:
          type: integer
        max_rows:
          type: integer
      required: [windows, count, scanned, bound_exceeded, unusable, unattested, max_live_windows,
                 max_seconds, max_rows]
    MaintenanceWindowDeclared:
      type: object
      description: |
        What one declaration wrote. A service scope produces one row per member, so `windows` is a list and
        `count` is how wide the silence actually is; `status` on each row is `declared` or `duplicate`.
      properties:
        windows:
          type: array
          items:
            type: object
            properties:
              window_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [declared, duplicate]
              resource_id:
                type: ['string', 'null']
              rule_id:
                type: ['string', 'null']
              starts_at:
                type: string
                format: date-time
              ends_at:
                type: string
                format: date-time
              reason:
                type: string
              declared_by:
                type: string
              explains:
                type: ['array', 'null']
                items:
                  $ref: '#/components/schemas/MaintenanceConditionClass'
            required: [window_id, status, starts_at, ends_at, reason, declared_by]
        count:
          type: integer
        members:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/MaintenanceScope'
        explains:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceConditionClass'
        bound_exceeded:
          type: boolean
        max_windows:
          type: integer
      required: [windows, count, scope, explains, bound_exceeded, max_windows]
    MaintenanceWindowCancelled:
      type: object
      description: |
        The window that stopped covering, named by id alone. An overlapping sibling is untouched and does
        not appear here — its absence from this answer is not a claim that it stopped.
      properties:
        window_id:
          type: string
          format: uuid
        status:
          type: string
          const: cancelled
        resource_id:
          type: ['string', 'null']
        rule_id:
          type: ['string', 'null']
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
        explains:
          type: ['array', 'null']
          items:
            $ref: '#/components/schemas/MaintenanceConditionClass'
        cancelled_by:
          type: string
        cancelled_at:
          type: string
          format: date-time
      required: [window_id, status, starts_at, ends_at, reason, cancelled_by, cancelled_at]
    MaintenanceOutcome:
      type: object
      description: |
        What the platform observed about a window that has run, computed from its own durable evidence
        rather than stored beside it. `evidence` is the sentences that earned the label, so a reader can
        disagree with `completed` without opening the database. `observed` is null while a window is still
        ahead of the clock, and `complete: false` means an input read hit a bound or the attestation is
        missing — in which case `unknown` is a statement about this build, not about the work.
      properties:
        outcome:
          type: string
          enum: [planned, active, completed, cancelled, unused, overrun, unknown]
        observed:
          type: ['boolean', 'null']
        complete:
          type: boolean
        evidence:
          type: array
          items:
            type: string
        attributions:
          type: array
          items:
            type: object
            properties:
              sequence:
                type: integer
              at:
                type: string
                format: date-time
              delivery:
                type: string
                format: uuid
              condition_class:
                $ref: '#/components/schemas/MaintenanceConditionClass'
            required: [sequence, at, delivery, condition_class]
        cancelled_before_start:
          type: boolean
          description: 'Present on a cancelled window: whether the revocation arrived before the start.'
      required: [outcome, observed, complete, evidence, attributions]
    MaintenanceWindowDetail:
      type: object
      description: |
        One window and what became of it. `window` is the stored record — including `attested` (does its
        audit evidence still stand) and `document_version` (1 or 2, which is what decides whether
        `explains` was ever named) — and `schedule`/`occurrence_id` repeat the origin for a reader who came
        from a report and wants the plan.
      properties:
        window:
          allOf:
            - $ref: '#/components/schemas/MaintenanceWindowRow'
            - type: object
              properties:
                attested:
                  type: boolean
                document_version:
                  type: integer
                  enum: [1, 2]
              required: [attested, document_version]
        outcome:
          $ref: '#/components/schemas/MaintenanceOutcome'
        schedule:
          type: ['string', 'null']
          format: uuid
        occurrence_id:
          type: ['string', 'null']
          format: uuid
      required: [window, outcome, schedule, occurrence_id]
    MaintenanceWindowHistory:
      type: object
      description: |
        The timeline: `declared`, at most one `revoked`, and one `folded` entry per page the delivery path
        attributed to this window by id. `count` is bounded by `max_events`; a truncated timeline says so
        through the bound on the attribution read rather than by quietly returning fewer pages.
      properties:
        window_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [planned, active, completed, cancelled, unused, overrun, unknown]
        events:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              what:
                type: string
                enum: [declared, revoked, folded]
              by:
                type: string
              attested:
                type: boolean
              delivery:
                type: string
                format: uuid
              condition_class:
                $ref: '#/components/schemas/MaintenanceConditionClass'
            required: [at, what, by]
        count:
          type: integer
        max_events:
          type: integer
      required: [window_id, outcome, events, count, max_events]
    MaintenanceWindowDeclaration:
      type: object
      description: |
        One planned silence. Times are timezone-aware and must be ISO 8601; the span may not exceed
        `max_seconds` (86400), and a window whose end is already in the past is refused — this API plans
        work, it does not explain history after the fact.
      properties:
        reason:
          type: string
          description: One line, at most 200 characters, stored verbatim and quoted in every page it folds.
        scope:
          $ref: '#/components/schemas/MaintenanceScope'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        explains:
          type: array
          description: Omit for the four classes planned work explains. Name the others to widen the silence.
          items:
            $ref: '#/components/schemas/MaintenanceConditionClass'
      required: [reason, scope, starts_at, ends_at]
    MaintenanceDroppedOccurrence:
      type: object
      description: |
        An occurrence the plan's `dst: skip` policy lost, named rather than only counted. The minute did not
        exist in that zone on that date; "why was nothing quiet on 29 March?" cannot be answered by a number,
        and moving the work to the neighbouring day would buy a second silence nobody planned.
      properties:
        index:
          type: integer
        local:
          type: string
          description: 'The local calendar date the occurrence would have fallen on (YYYY-MM-DD).'
        time_of_day:
          type: string
          description: 'The local minute the plan asked for, which the zone never showed.'
        timezone:
          type: string
        reason:
          type: string
      required: [index, local, time_of_day, timezone, reason]
    MaintenanceOccurrence:
      type: object
      description: |
        One computed occurrence of a plan. `occurrence_id` is derived from
        (schedule id, version, ordinal, instant) and not stored, so the same version always yields the same
        ids — including after a restore, which is what makes a re-run answer `duplicate` instead of declaring
        a second silence. `dst` names what the zone did with that minute: `normal`, `fold` (the minute came
        twice), `gap` (it did not exist and a policy other than `skip` kept the occurrence) or
        `offset-preserved` (the plan's `fixed` policy held the offset, so the local clock face moved). `past`
        means the occurrence ended before the clock and will never be declared.
      properties:
        index:
          type: integer
        occurrence_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        dst:
          type: string
          enum: [normal, gap, fold, offset-preserved]
        started:
          type: boolean
        past:
          type: boolean
      required: [index, occurrence_id, starts_at, ends_at, dst, started, past]
    MaintenanceRecurrence:
      type: object
      description: |
        The recurrence this build can speak: `daily` or `weekly`, an interval, a wall-clock minute, and an
        IANA zone with an explicit DST policy. `wall` keeps the clock the operator typed across a
        transition; `fixed` keeps the offset the first occurrence established, so the local time drifts;
        `skip` drops an occurrence whose minute does not exist. There is no cron and no monthly rule: their
        DST behaviour is not derivable from a string, and guessing it is how a silence moves twice a year
        without anyone deciding to.
      properties:
        frequency:
          type: string
          enum: [daily, weekly]
        interval:
          type: integer
          minimum: 1
        days_of_week:
          type: array
          description: Monday is 0. Required for `weekly`, forbidden for `daily`.
          items:
            type: integer
            minimum: 0
            maximum: 6
        time_of_day:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        timezone:
          type: string
          description: An IANA zone name (`Europe/London`), resolved by the standard library at read time.
        dst:
          type: string
          enum: [wall, fixed, skip]
      required: [frequency, interval, days_of_week, time_of_day, duration_seconds, timezone, dst]
    MaintenanceBounds:
      type: object
      description: |
        A finite end, required. Exactly one of `occurrences` or `until` beside `first_occurrence`. An
        open-ended recurrence is refused outright: unbounded silence is not maintenance, it is an outage
        with a login, and the platform will not sign it on a plan's behalf.
      properties:
        first_occurrence:
          type: string
          description: A local calendar date (YYYY-MM-DD) in the plan's own zone.
          pattern: '^\d{4}-\d{2}-\d{2}$'
        occurrences:
          type: integer
          minimum: 1
          maximum: 400
        until:
          type: string
          description: Inclusive last local date. The last occurrence may start on this day.
          pattern: '^\d{4}-\d{2}-\d{2}$'
      required: [first_occurrence]
    MaintenanceSchedule:
      type: object
      description: |
        One version of a plan, exactly as signed. A schedule is not a window: it is the intention, and the
        windows are its consequence, materialized in bounded slices. `horizon`, `declared_by` and `attest`
        come from the row that stores the version rather than from the signed fields.
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        state:
          type: string
          enum: [active, cancelled]
        reason:
          type: string
        scope:
          $ref: '#/components/schemas/MaintenanceScope'
        explains:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceConditionClass'
        recurrence:
          $ref: '#/components/schemas/MaintenanceRecurrence'
        bounds:
          $ref: '#/components/schemas/MaintenanceBounds'
        author:
          type: string
        declared_at:
          type: string
          format: date-time
        horizon:
          type: string
          format: date-time
        declared_by:
          type: string
        attest:
          type: integer
      required: [id, version, state, reason, scope, explains, recurrence, bounds, author, declared_at]
    MaintenanceScheduleWrite:
      type: object
      description: |
        The result of one schedule write. `status` says which act this was (`declared`, `duplicate`,
        `revised` through a new version, `cancelled`, `rolled_forward`), `windows` lists every window the
        slice produced with its occurrence id and DST verdict, and `horizon` is how far the plan is now
        materialized. `duplicates` counts occurrences that were already declared — a retried roll-forward
        writes nothing and says so here.
      properties:
        status:
          type: string
          enum: [declared, duplicate, rolled_forward, cancelled]
        id:
          type: string
          format: uuid
        version:
          type: integer
        schedule:
          $ref: '#/components/schemas/MaintenanceSchedule'
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceOccurrence'
        windows:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/MaintenanceWindowRow'
              - type: object
                properties:
                  dst:
                    type: string
                    enum: [normal, gap, fold, offset-preserved]
                  status:
                    type: string
                    enum: [declared, duplicate]
                required: [dst, status]
        declared:
          type: integer
        duplicates:
          type: integer
        horizon:
          type: string
          format: date-time
        skipped_occurrences:
          type: integer
        dropped_occurrences:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceDroppedOccurrence'
        members:
          type: array
          items:
            type: string
        bound_exceeded:
          type: boolean
        windows_revoked:
          type: integer
          description: 'On a revise or a cancel: how many unstarted windows from earlier versions stopped.'
        windows_superseded:
          type: array
          items:
            type: string
            format: uuid
      required: [status, id, version, schedule, occurrences, windows, declared, duplicates, horizon,
                 skipped_occurrences, dropped_occurrences, members, bound_exceeded]
    MaintenanceScheduleDeclaration:
      type: object
      description: |
        A plan and its first bounded slice. `version`, `state` and `author` are the server's to decide and
        are not accepted here — the author is the credential, never a body field.
      properties:
        reason:
          type: string
        scope:
          $ref: '#/components/schemas/MaintenanceScope'
        recurrence:
          $ref: '#/components/schemas/MaintenanceRecurrence'
        bounds:
          $ref: '#/components/schemas/MaintenanceBounds'
        explains:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceConditionClass'
      required: [reason, scope, recurrence, bounds]
    MaintenanceScheduleRevision:
      type: object
      description: |
        The whole plan as it should read, plus the version it is replacing. A revision is not a patch of
        individual fields: the new version is a complete document, so a reader looking at version 3 sees
        everything version 3 says. `expected_version` is what makes an edit safe — a plan that moved since
        the caller read it is refused with `412` rather than quietly overwritten.
      properties:
        expected_version:
          type: integer
          minimum: 1
        reason:
          type: string
        scope:
          $ref: '#/components/schemas/MaintenanceScope'
        recurrence:
          $ref: '#/components/schemas/MaintenanceRecurrence'
        bounds:
          $ref: '#/components/schemas/MaintenanceBounds'
        explains:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceConditionClass'
      required: [expected_version, reason, scope, recurrence, bounds]
    MaintenanceScheduleList:
      type: object
      description: |
        Current versions only, filtered on the state of that version. `unreadable` and `unattested` count
        rows this build could not re-validate or could not match to an audit entry; they are counted, never
        dropped, because a store this build cannot read to the end is a fact the operator is owed.
      properties:
        schedules:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/MaintenanceSchedule'
              - type: object
                properties:
                  attested:
                    type: boolean
                required: [attested]
        count:
          type: integer
        scanned:
          type: integer
        unreadable:
          type: integer
        unattested:
          type: integer
        state:
          type: string
          enum: [active, cancelled, all]
        bound_exceeded:
          type: boolean
        max_rows:
          type: integer
        now:
          type: string
          format: date-time
      required: [schedules, count, scanned, unreadable, unattested, state, bound_exceeded, max_rows, now]
    MaintenanceScheduleDetail:
      type: object
      description: |
        The plan, its versions, what it has materialized and what it still intends. `occurrences` is
        recomputed from the document on every read — the plan is the fact, the windows are its consequence —
        and `materialized_through` is the durable cursor a previous roll-forward left, absent until one
        runs. This read never declares anything.
      properties:
        schedule:
          allOf:
            - $ref: '#/components/schemas/MaintenanceSchedule'
            - type: object
              properties:
                attested:
                  type: boolean
              required: [attested]
        history:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceScheduleVersion'
        versions:
          type: integer
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceOccurrence'
        materialized_through:
          type: string
          format: date-time
        occurrence_bound:
          type: boolean
        skipped_occurrences:
          type: integer
        dropped_occurrences:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceDroppedOccurrence'
        scope_members:
          type: ['array', 'null']
          items:
            type: string
        now:
          type: string
          format: date-time
        bound_exceeded:
          type: boolean
      required: [schedule, history, versions, occurrences, materialized_through, occurrence_bound,
                 skipped_occurrences, dropped_occurrences, scope_members, now, bound_exceeded]
    MaintenanceScheduleVersion:
      type: object
      description: |
        One version's row: what state it was in force under, who declared it, and whether this build can
        still match it to its audit entry. An `unreadable` version is reported, not skipped — a corrupt
        newest version that disappears from the list would hand a caller an older plan to edit.
      properties:
        version:
          type: integer
        declared_at:
          type: string
        declared_by:
          type: string
        state:
          type: string
          enum: [active, cancelled]
        horizon:
          type: string
        unreadable:
          type: boolean
        attested:
          type: boolean
      required: [version, declared_at, declared_by, state, horizon, unreadable, attested]
    MaintenanceScheduleHistory:
      type: object
      description: Every version of one plan, oldest first, with the document as stored.
      properties:
        id:
          type: string
          format: uuid
        versions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/MaintenanceScheduleVersion'
              - type: object
                properties:
                  document:
                    oneOf:
                      - $ref: '#/components/schemas/MaintenanceSchedule'
                      - type: 'null'
                required: [document]
        count:
          type: integer
        attested:
          type: integer
        bound_exceeded:
          type: boolean
      required: [id, versions, count, attested, bound_exceeded]
    MaintenanceIntervalRow:
      type: object
      description: |
        One window as a report sees it, with two spans that are not the same claim. `raw` is what a human
        signed and never moves; `adjusted` is what the platform actually held quiet — truncated at a
        revocation, and null for a window this build refuses to apply (`applied: false`, with `adjustment`
        saying why). Printing only the raw span would claim a silence nobody observed.
      properties:
        window_id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/MaintenanceScope'
        raw:
          type: object
          properties:
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
          required: [starts_at, ends_at]
        adjusted:
          type: ['object', 'null']
        applied:
          type: boolean
        adjustment:
          type: ['string', 'null']
        explains:
          type: ['array', 'null']
          items:
            $ref: '#/components/schemas/MaintenanceConditionClass'
        author:
          type: string
        declared_at:
          type: string
          format: date-time
        schedule_id:
          type: ['string', 'null']
        schedule_version:
          type: ['integer', 'null']
        occurrence_id:
          type: ['string', 'null']
        outcome:
          type: string
          enum: [planned, active, completed, cancelled, unused, overrun, unknown]
      required: [window_id, scope, raw, adjusted, applied, explains, author, declared_at, outcome]
    MaintenanceIntervalAnswer:
      oneOf:
        - description: 'The span form: what was quiet between two instants, and which window says so.'
          type: object
          properties:
            intervals:
              type: array
              items:
                $ref: '#/components/schemas/MaintenanceIntervalRow'
            count:
              type: integer
            returned_of:
              type: integer
            effective:
              type: array
              items:
                type: object
                properties:
                  starts_at:
                    type: string
                    format: date-time
                  ends_at:
                    type: string
                    format: date-time
                  explained_by:
                    type: array
                    items:
                      type: string
                      format: uuid
                required: [starts_at, ends_at, explained_by]
            span:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
              required: [from, to]
            scope:
              $ref: '#/components/schemas/MaintenanceScope'
            scope_members:
              type: ['array', 'null']
              items:
                type: string
            truncated:
              type: boolean
            complete:
              type: boolean
            bounds:
              type: object
              properties:
                scanned:
                  type: integer
                bound_exceeded:
                  type: boolean
                unusable:
                  type: integer
                unattested:
                  type: integer
                max_rows:
                  type: integer
              required: [scanned, bound_exceeded]
            retroactive:
              type: boolean
          required: [intervals, count, returned_of, effective, span, scope, truncated, complete, bounds,
                     retroactive]
        - description: 'The instant form: what one moment was, which is how a late fact reaches its window.'
          type: object
          properties:
            at:
              type: string
              format: date-time
            scope:
              $ref: '#/components/schemas/MaintenanceScope'
            classification:
              type: string
              enum: [planned, outside, unknown]
            incomplete_reason:
              type: ['string', 'null']
            explained_by:
              type: array
              items:
                type: string
                format: uuid
            covers_instant:
              type: array
              items:
                type: string
                format: uuid
            primary:
              type: ['object', 'null']
            complete:
              type: boolean
            bounds:
              type: object
              properties:
                scanned:
                  type: integer
                bound_exceeded:
                  type: boolean
                max_rows:
                  type: integer
              required: [scanned, bound_exceeded]
            retroactive:
              type: boolean
          required: [at, scope, classification, incomplete_reason, explained_by, covers_instant, primary,
                     complete, bounds, retroactive]
    MaintenanceScheduleCancelled:
      type: object
      description: |
        A plan's future, stopped. The cancelled version is appended rather than the current one rewritten,
        so the version that ran stays readable; `windows_revoked` counts only windows that had not started,
        and a window already running is left exactly as its author signed it.
      properties:
        status:
          type: string
          const: cancelled
        id:
          type: string
          format: uuid
        version:
          type: integer
        schedule:
          $ref: '#/components/schemas/MaintenanceSchedule'
        windows_revoked:
          type: integer
        windows_superseded:
          type: array
          items:
            type: string
            format: uuid
        bound_exceeded:
          type: boolean
      required: [status, id, version, schedule, windows_revoked, windows_superseded, bound_exceeded]
    ActorStamp:
      description: >-
        Who made the request, taken from the credential. It appears in answers and is refused in bodies:
        `api_contract.assert_no_actor_claim` rejects a body that names an identity or a role.
      type: object
      properties:
        identity:
          type: string
        role:
          type: string
      required: [identity, role]
      additionalProperties: false
    CapabilityArtifacts:
      description: >-
        One entry per mounted artifact: whether it is present, and for the index what it says about
        itself. Nothing here rebuilds, repairs or writes any of them.
      type: object
      properties:
        inventory_index:
          type: object
          properties:
            built_at:
              anyOf:
              -
                type: string
                format: date-time
              -
                type: "null"
            declaration_revision:
              anyOf:
              -
                type: string
              -
                type: "null"
            declaration_sha256:
              anyOf:
              -
                type: string
                pattern: ^[a-f0-9]{64}$
              -
                type: "null"
            mounted:
              description: >-
                Whether the artifact this read needs is present in this process.
              type: boolean
            rebuilt_over_http:
              type: boolean
          required: [built_at, declaration_revision, declaration_sha256, mounted, rebuilt_over_http]
          additionalProperties: false
        observed_dataset:
          type: object
          properties:
            mounted:
              description: >-
                Whether the artifact this read needs is present in this process.
              type: boolean
            unavailable:
              description: >-
                The sentence naming the missing mount, or null when the artifact is there.
              anyOf:
              -
                type: string
              -
                type: "null"
          required: [mounted, unavailable]
          additionalProperties: false
        proposal_directory:
          type: object
          properties:
            mounted:
              description: >-
                Whether the artifact this read needs is present in this process.
              type: boolean
          required: [mounted]
          additionalProperties: false
        sigma_compiler:
          type: object
          properties:
            installed:
              type: boolean
            owner:
              type: string
          required: [installed, owner]
          additionalProperties: false
        telemetry_reader:
          type: object
          properties:
            mounted:
              description: >-
                Whether the artifact this read needs is present in this process.
              type: boolean
          required: [mounted]
          additionalProperties: false
      required: [inventory_index, observed_dataset, proposal_directory, sigma_compiler, telemetry_reader]
      additionalProperties: false
    CapabilityDecline:
      description: >-
        One operation this family will not serve over HTTP, why, and where the capability lives instead.
      type: object
      properties:
        instead:
          type: string
        operation_id:
          type: string
        reason:
          description: >-
            Present with `status: unavailable`: what is missing and which mount variable names it.
          type: string
      required: [instead, operation_id, reason]
      additionalProperties: false
    CapabilityDocument:
      description: >-
        What this process can actually answer, read from its own mounts. It enumerates three states per
        operation — `served`, `unavailable` (this build would answer it, the artifact is not mounted)
        and `refused` (a decision, not a gap) — and names the declines so an agent can plan a call
        instead of discovering the wall at the wall.
      type: object
      properties:
        artifacts:
          $ref: '#/components/schemas/CapabilityArtifacts'
        complete:
          description: >-
            False whenever anything was withheld — an unmounted artifact, a store error, a bound hit.
          type: boolean
        declines:
          type: array
          items:
              $ref: '#/components/schemas/CapabilityDecline'
        operations:
          type: array
          items:
              $ref: '#/components/schemas/CapabilityOperation'
        reported_at:
          type: string
          format: date-time
        schema_version:
          type: integer
        scope:
          description: >-
            What the answer does and does not authorise.
          type: string
        truncated:
          description: >-
            True only when a stated bound cut rows off this answer.
          type: boolean
      required: [artifacts, complete, declines, operations, reported_at, schema_version, scope, truncated]
      additionalProperties: false
    CapabilityOperation:
      description: >-
        One operation this family answers. `supported` means the route exists **and** its input is
        mounted; `unavailable` means the route exists, this build would answer it, and the artifact is
        not mounted — with the sentence naming which variable. A refusal by decision is not a state
        here: it is a row in `declines`.
      type: object
      properties:
        method:
          type: string
        operation_id:
          type: string
        reason:
          description: >-
            Present with `status: unavailable`: what is missing and which mount variable names it.
          type: string
        route:
          type: string
        state:
          type: string
          enum: ["supported", "unavailable"]
      required: [method, operation_id, route]
      additionalProperties: false
    ConfigDriftComparison:
      description: >-
        A content-drift dry run. `changed`, the two digests and the diff come from the caller's own
        previous/current text; the event that a real round would file is previewed, not filed.
      type: object
      properties:
        actor:
          $ref: '#/components/schemas/ActorStamp'
        artifact:
          type: string
        changed:
          type: boolean
        complete:
          description: >-
            False whenever anything was withheld — an unmounted artifact, a store error, a bound hit.
          type: boolean
        current_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        diff:
          type: string
        digest_source:
          type: string
        durable:
          description: >-
            Always false here: a preview files nothing.
          type: boolean
        event_would_be:
          $ref: '#/components/schemas/EventPreview'
        family:
          type: string
        not_performed:
          description: >-
            What a real producer round would have done and this call deliberately did not.
          type: array
          items:
              type: string
        previous_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        schema_version:
          type: integer
        window:
          $ref: '#/components/schemas/Window'
      required: [actor, artifact, changed, complete, current_sha256, diff, digest_source, durable, event_would_be, family, not_performed, previous_sha256, schema_version, window]
      additionalProperties: false
    DashboardExport:
      description: >-
        A review document for one dashboard edit: who owns the record, the digest of what was observed,
        and the next step a human must take. It imports nothing and calls no API.
      type: object
      properties:
        deploy_authorized:
          description: >-
            Always false here: nothing on this route authorises a deployment.
          type: boolean
        id:
          type: string
        next_step:
          type: string
        observed_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        owner:
          type: string
        requested_by:
          $ref: '#/components/schemas/ActorStamp'
        schema_version:
          type: integer
        spec:
          description: >-
            The caller's own document, echoed as the next step describes it. This module reads no field of
            it beyond the record id.
          type: object
        written:
          description: >-
            Always false here: no artifact was written by this call.
          type: boolean
      required: [deploy_authorized, id, next_step, observed_sha256, owner, requested_by, schema_version, written]
      additionalProperties: false
    DeclarationCheck:
      description: >-
        The verdict of the same validator `lo-inventory build` runs before it writes an index —
        including the secret-bearing-attribute and credential-reference refusals. It validates bytes the
        caller owns and records nothing: `recorded: false` is the shape of the door, not a mode.
      type: object
      properties:
        complete:
          description: >-
            False whenever anything was withheld — an unmounted artifact, a store error, a bound hit.
          type: boolean
        declaration_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        kinds:
          type: array
          items:
              type: string
        recorded:
          type: boolean
        resources:
          type: integer
        schema_version:
          type: integer
        status:
          description: >-
            Reads: `ok` or `unavailable`. Writes/previews: the domain function's own verdict.
          type: string
      required: [complete, declaration_sha256, kinds, recorded, resources, schema_version, status]
      additionalProperties: false
    DeclaredResourceMatch:
      description: >-
        The answer to "which resource is this name?" — `resolved` with one candidate, `conflict` with
        every candidate and no winner chosen for the caller, `unresolved` with none. A collision is
        never broken by picking the first row.
      type: object
      properties:
        candidates:
          type: array
          items:
              type: string
              format: uuid
        complete:
          description: >-
            False whenever anything was withheld — an unmounted artifact, a store error, a bound hit.
          type: boolean
        limit:
          type: "null"
        plane:
          description: >-
            Which plane the answer describes: `declared`, `observed`, or `declared+observed` for a join.
          type: string
        provenance:
          $ref: '#/components/schemas/ReadProvenance'
        reason:
          description: >-
            Present with `status: unavailable`: what is missing and which mount variable names it.
          type: string
        resource:
          type: object
          properties:
            id:
              type: string
            kind:
              type: string
            name:
              type: string
            owner:
              type: "null"
          required: [id, kind, name, owner]
          additionalProperties: false
        resource_id:
          anyOf:
          -
            type: string
            format: uuid
          -
            type: "null"
        returned:
          type: integer
        rows:
          type: array
          items:
              type: object
        schema_version:
          type: integer
        status:
          description: >-
            Reads: `ok` or `unavailable`. Writes/previews: the domain function's own verdict.
          type: string
          enum: ["resolved", "unknown", "unknown_uuid"]
        truncated:
          description: >-
            True only when a stated bound cut rows off this answer.
          type: boolean
      required: [complete, provenance, resource_id, schema_version, truncated]
      additionalProperties: false
    DeclaredResourcePage:
      description: >-
        One page of the **declared** plane: what the built index says is wanted, never what a probe saw.
        An installation with no index mounted still answers `200` here and says so (`status:
        unavailable`, `complete: false`, `reason` naming `LO_INDEX_PATH`), because "this build cannot
        see the declarations" is an answer to the question, not a failure to answer it.
      type: object
      properties:
        complete:
          description: >-
            False whenever anything was withheld — an unmounted artifact, a store error, a bound hit.
          type: boolean
        filtered:
          type: boolean
        filters:
          description: >-
            The filters actually applied, echoed so a page can be interpreted without its request.
          type: object
          additionalProperties: {"type": "string"}
          propertyNames: {"enum": ["kind", "name"]}
        limit:
          type: integer
        next_cursor:
          type: string
        provenance:
          $ref: '#/components/schemas/ReadProvenance'
        reason:
          description: >-
            Present with `status: unavailable`: what is missing and which mount variable names it.
          type: string
        returned:
          type: integer
        rows:
          type: array
          items:
              $ref: '#/components/schemas/DeclaredResourceRow'
        rows_total:
          type: integer
        schema_version:
          type: integer
        status:
          description: >-
            Reads: `ok` or `unavailable`. Writes/previews: the domain function's own verdict.
          type: string
        truncated:
          description: >-
            True only when a stated bound cut rows off this answer.
          type: boolean
      required: [complete, limit, provenance, returned, rows, schema_version, status, truncated]
      additionalProperties: false
    DeclaredResourceRow:
      description: >-
        One declaration as the index stored it: identity, kind, name, its aliases, how many relations it
        names, and an `owner` that is `null` unless the declaration carried one.
      type: object
      properties:
        aliases:
          type: array
          items:
              type: object
              properties:
                scope:
