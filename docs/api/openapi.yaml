          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceScheduleWrite'
        '400':
          oneOf:
            - $ref: '#/components/responses/BadRequest'
            - $ref: '#/components/responses/ContractError'
        '403':
