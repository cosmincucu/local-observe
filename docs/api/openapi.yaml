      x-required-role: [reader, proposer, human, executor]
      summary: Read one drafted proposal back, by the digest its own content produced.
      description: |
        The identifier is validated as a SHA-256 digest before any path is built, and the file is opened only
        inside the mounted directory: a caller may name a digest here, never a location. An unreadable document
        is a `503` naming the failure class, and an unknown digest is a `404` whose one sentence covers "not a
        proposal identifier" and "no such proposal" — so the route is not an oracle for which drafts exist.
      parameters:
        - $ref: '#/components/parameters/ProposalId'
