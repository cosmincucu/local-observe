              schema:
                $ref: '#/components/schemas/ProposalRead'
        '403':
          $ref: '#/components/responses/SummaryOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/queries/signals:
    get:
      tags: [queries]
      operationId: resource.query.series
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: One bounded signal window — the rows a verdict was made from, or the reason there are none.
      description: |
        The HTTP shape of the MCP `signal_series` tool, over the same reader and the same approved query-kind
        table (`tools.SERIES_SIGNALS`). `signal` selects one kind; **no query text, table, column or statement
        is accepted at any level**, and the store facade builds its own SQL from the kind's name.

        `result` is the `docs/CONTRACTS.md` §2 envelope shipped unchanged — `source`, `query_type`,
        `parameters`, the half-open UTC `window`, `rows`, `row_limit`, `truncated`, `error` — because it is the
        document every producer already emits. An empty window with `error: null` is an honest empty answer; a
        non-null `error` is a refusal, and the two are never both. A process with no read-only store client
        mounted gets the same envelope with `error` naming the missing variables, which is why this read
        answers `200` and not `503`: the store said something, and what it said was "I was not asked".
      parameters:
        - name: signal
          in: query
          required: true
          schema:
            type: string
            enum: [metrics, logs, traces]
        - name: resource_id
          in: query
          required: false
          description: |
            A declared resource UUID. The metric kind's own read requires one and the trace kind refuses it
