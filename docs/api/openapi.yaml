  /v1/maintenance-windows:
    get:
      tags: [maintenance]
      operationId: maintenance.window.read
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: The windows this platform is holding, each with whether its attestation can be trusted.
      description: |
        `suppression.live_windows` over a credential: the declared rows whose span has not ended, ordered by
        (starts_at, id), with `covers_now` saying whether each one is covering at the instant of the read.
        A `service`-scoped plan appears as one row per member, because that is what the delivery path matches.

        Three counts sit beside the rows and each of them can be the real answer: `unusable` (a stored
        document this build cannot validate, which suppresses nothing and needs a human), `unattested` (a
        row whose `maintenance.declared` audit evidence is missing, which also suppresses nothing), and
        `bound_exceeded` (the scan stopped at `max_rows`, so the list is not whole and absence in it is not
        absence in the estate). `producer` is deliberately not in the role list: a detector that could read
        which silences cover its own findings could schedule its findings around them.
