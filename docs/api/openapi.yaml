      description: |
        A report read, never a scheduler: this answers what has been declared and what the plan still
        intends, and it declares nothing. `materialized_through` is the durable horizon a previous
        materialization wrote (absent until one has run), and `occurrences` lists the next slice after it —
        each with its stable `occurrence_id`, its resolved instants and the `dst` verdict the zone gave that
        minute (`normal`, `gap` or `fold`).
      parameters:
        - name: id
          in: path
