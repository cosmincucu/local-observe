      operationId: notification.callback.record
      x-status: implemented
      x-required-role: [human, proposer, executor]
      summary: Record the intent a notified human acted on.
      description: |
        The single-use code travels in the body, never in the path or a query string, because both are
        logged by everything between a phone and this process. A wrong code, an unknown channel and a code
        minted for another channel answer with the same bytes — which of the three it was is not the
        caller's to learn. The action stays `pending`: an intent is not a decision. This route is
        deliberately outside the `Idempotency-Key` list — the token is itself the single-use identity, and a
        stored success replayed after it was spent would report an intent this route exists to refuse.
