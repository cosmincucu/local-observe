  /v1/alert-occurrences:
    get:
      tags: [occurrences]
      operationId: occurrence.list
      x-status: implemented
      x-required-role: [reader, proposer, human, executor]
      summary: One bounded page of alert episodes, each with its disposition and its delivery roll-up.
      description: |
        An occurrence is one episode of one condition, and its id is the incident id `Store.intake` mints
        (`docs/api/occurrences.md` §1). Three separate axes are reported beside it — what the source
        measures, what a human has decided, and what has been delivered — and none of them is the other.
        There is no filter: the boundary's page parser admits `limit` and `cursor` only, and refuses rather
        than clamps, so an operator narrows the answer by paging through it. Oldest episode first, walked by
        a stored monotonic position, so a page can neither lose an episode nor repeat one.

        The role list is the transport's whole-`GET` gate, which admits four roles and not five: a
        `producer` credential is answered `400` with the flat `{"error":"not_authorised"}` body every other
        read in this API gives it (a producer files verdicts and reads nothing), and a `summary` credential
        is answered `403 {"error":"summary_only"}` by the gate that runs ahead of routing. Both refusals are
        the transport's, not this module's, and so are not in the machine envelope.
