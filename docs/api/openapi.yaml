      x-required-role: [human]
      summary: Sign a recurring maintenance plan and declare its first bounded slice of windows.
      description: |
        A schedule is the plan; the windows are what the platform actually holds quiet. Declaring one
        materializes at most `MAX_MATERIALIZED_OCCURRENCES` (8) occurrences, never more than 35 days ahead,
        and the answer names every window it produced with its stable `occurrence_id`. Rolling the horizon
        forward is a later, explicit write (`POST .../materializations`) — a timer that signed silences in a
        human's name would put a machine's signature on a page nobody agreed to withhold.

        Three parts are mandatory and none of them is guessable: `scope` (resource, service or rule),
        `recurrence` (an IANA `timezone`, a wall-clock `time_of_day`, `daily`/`weekly`, and an explicit
        `dst` policy of `wall`, `fixed` or `skip`), and `bounds`. Bounds must be finite — `occurrences` or
        `until`, exactly one, alongside `first_occurrence`. **Open-ended silence is not maintenance**: a
        plan that never ends is not a schedule, it is an outage with a login.
